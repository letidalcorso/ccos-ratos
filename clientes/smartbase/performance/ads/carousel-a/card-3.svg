<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Ghost "1" texture -->
  <text x="680" y="720" font-family="'Inter', system-ui, sans-serif" font-size="560" font-weight="800" fill="#3E82F7" opacity="0.04" text-anchor="middle">1</text>

  <!-- Pilar pill -->
  <rect x="80" y="80" width="138" height="28" rx="14" fill="#0A201A"/>
  <text x="149" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1.5">AUTORIDADE</text>

  <!-- Accent line -->
  <rect x="80" y="130" width="80" height="6" rx="3" fill="#10B981"/>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">3 / 4</text>

  <!-- Headline -->
  <text x="80" y="248" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#F2F2F6">A mesma garantia</text>
  <text x="80" y="330" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#F2F2F6">que você teria</text>
  <text x="80" y="412" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#3E82F7">na Apple Store.</text>

  <!-- Divider -->
  <line x1="80" y1="452" x2="700" y2="452" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Key statement -->
  <text x="80" y="512" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="400" fill="#C0C0D0">1 ano. Direto da Apple. Não nossa.</text>

  <!-- Detail block -->
  <rect x="80" y="556" width="920" height="150" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="556" width="5" height="150" rx="2.5" fill="#3E82F7"/>

  <text x="118" y="600" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">É a garantia da Apple, não a nossa.</text>
  <text x="118" y="636" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">Se precisar, você aciona direto — sem passar pela Smartbase.</text>
  <text x="118" y="680" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="600" fill="#C0C0D0">A gente só intermediou a compra. O resto é Apple com você.</text>

  <!-- Footer divider -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
