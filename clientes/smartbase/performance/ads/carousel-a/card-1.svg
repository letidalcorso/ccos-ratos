<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Ghost numeral texture -->
  <text x="680" y="760" font-family="'Inter', system-ui, sans-serif" font-size="480" font-weight="800" fill="#3E82F7" opacity="0.04" text-anchor="middle">17</text>

  <!-- Pilar pill -->
  <rect x="80" y="80" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Accent line -->
  <rect x="80" y="130" width="80" height="6" rx="3" fill="#3E82F7"/>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">1 / 4</text>

  <!-- Hook — principal -->
  <text x="80" y="248" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#F2F2F6">Você não precisa</text>
  <text x="80" y="328" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#F2F2F6">da Apple Store</text>
  <text x="80" y="408" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#3E82F7">para ter um</text>
  <text x="80" y="488" font-family="'Inter', system-ui, sans-serif" font-size="68" font-weight="800" fill="#3E82F7">iPhone original.</text>

  <!-- Divider -->
  <line x1="80" y1="526" x2="1000" y2="526" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="578" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">iPhone 17 Pro Max · lacrado · verificado · entrega CXS e Brasil</text>

  <!-- Swipe cue -->
  <text x="80" y="650" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#3E82F7">arrasta pra entender por quê →</text>

  <!-- Footer divider -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
