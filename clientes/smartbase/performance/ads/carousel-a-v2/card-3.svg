<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Ghost texture -->
  <text x="660" y="780" font-family="'Inter', system-ui, sans-serif" font-size="520" font-weight="800" fill="#10B981" opacity="0.03" text-anchor="middle">✓</text>

  <!-- Pilar pill — AUTORIDADE verde -->
  <rect x="80" y="80" width="136" height="28" rx="14" fill="#0A201A"/>
  <text x="148" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1.5">AUTORIDADE</text>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">3 / 4</text>

  <!-- Accent line -->
  <rect x="80" y="128" width="64" height="5" rx="2.5" fill="#10B981"/>

  <!-- Headline -->
  <text x="80" y="290" font-family="'Inter', system-ui, sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">IMEI verificável</text>
  <text x="80" y="390" font-family="'Inter', system-ui, sans-serif" font-size="88" font-weight="800" fill="#10B981">antes de pagar.</text>

  <!-- Divider -->
  <line x1="80" y1="430" x2="920" y2="430" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="482" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">você confere no site da Apple antes de qualquer coisa.</text>

  <!-- Seals row -->
  <rect x="80" y="530" width="188" height="36" rx="18" fill="#0A201A"/>
  <text x="174" y="554" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  IMEI verificável</text>

  <rect x="284" y="530" width="148" height="36" rx="18" fill="#0A201A"/>
  <text x="358" y="554" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  Lacrado</text>

  <rect x="448" y="530" width="218" height="36" rx="18" fill="#0A201A"/>
  <text x="557" y="554" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  Garantia Apple 1 ano</text>

  <!-- Swipe cue -->
  <text x="80" y="630" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#3E82F7">próximo →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
