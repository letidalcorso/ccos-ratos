<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Color block superior azul -->
  <rect x="0" y="0" width="1080" height="420" fill="#0E1E3A"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="116" height="28" rx="14" fill="#1A3060"/>
  <text x="138" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Counter -->
  <text x="1000" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">1 / 4</text>

  <!-- Headline -->
  <text x="80" y="196" font-family="'Inter', system-ui, sans-serif" font-size="56" font-weight="800" fill="#C0C0D0">antes de comprar</text>
  <text x="80" y="264" font-family="'Inter', system-ui, sans-serif" font-size="56" font-weight="800" fill="#F2F2F6">qualquer iPhone,</text>
  <text x="80" y="332" font-family="'Inter', system-ui, sans-serif" font-size="56" font-weight="800" fill="#3E82F7">veja isso.</text>

  <!-- Divider -->
  <line x1="80" y1="460" x2="1000" y2="460" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="530" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="400" fill="#7A7A96">tem uma forma de confirmar</text>
  <text x="80" y="568" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="400" fill="#7A7A96">se o aparelho é original antes de pagar.</text>
  <text x="80" y="624" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="600" fill="#C0C0D0">a Smartbase usa isso em toda venda.</text>

  <!-- Swipe cue -->
  <text x="80" y="720" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#3E82F7">arrasta pra ver →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
