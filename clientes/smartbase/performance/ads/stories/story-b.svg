<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
    <!-- GRADIENTE: funde a foto com o fundo escuro -->
    <linearGradient id="photoFade" x1="0" y1="780" x2="0" y2="1150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07070E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07070E" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#07070E"/>

  <!--
    ═══════════════════════════════════════════════
    FOTO DO PRODUTO
    Substituir o bloco abaixo pela linha:
    <image href="fotos/nome-da-foto.jpg" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
    ═══════════════════════════════════════════════
  -->
  <rect x="0" y="0" width="1080" height="1080" fill="#0D0D1F"/>
  <rect x="440" y="470" width="200" height="120" rx="8" fill="#1A1A30"/>
  <text x="540" y="525" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#2E2E50" text-anchor="middle">foto do produto</text>
  <text x="540" y="548" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#252545" text-anchor="middle">iPhone aberto / em uso</text>

  <!-- Gradient overlay: foto → fundo -->
  <rect x="0" y="780" width="1080" height="370" fill="url(#photoFade)"/>

  <!-- ─── CONTENT ZONE (y=1150–1680) ─── -->

  <!-- Label -->
  <text x="80" y="1175" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#4A4A60" letter-spacing="3">IPHONE 17</text>

  <!-- Accent line -->
  <rect x="80" y="1190" width="60" height="5" rx="2.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="1275" font-family="'Inter', system-ui, sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">Você escolhe</text>
  <text x="80" y="1363" font-family="'Inter', system-ui, sans-serif" font-size="80" font-weight="800" fill="#3E82F7">o modelo.</text>

  <!-- Modelos block -->
  <rect x="80" y="1388" width="920" height="152" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="1388" width="5" height="152" rx="2.5" fill="#3E82F7"/>

  <text x="118" y="1428" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#F2F2F6">Pro Max</text>
  <text x="260" y="1428" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">6,9" · Titânio · zoom 5x</text>
  <text x="880" y="1428" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#3E82F7" text-anchor="end">R$9.200</text>

  <line x1="118" y1="1448" x2="960" y2="1448" stroke="#1E1E2E" stroke-width="1"/>

  <text x="118" y="1482" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#F2F2F6">Pro</text>
  <text x="175" y="1482" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">6,3" · Titânio · zoom 4x</text>
  <text x="880" y="1482" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#7A7A96" text-anchor="end">consultar</text>

  <line x1="118" y1="1502" x2="960" y2="1502" stroke="#1E1E2E" stroke-width="1"/>

  <text x="118" y="1536" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#F2F2F6">iPhone 17</text>
  <text x="246" y="1536" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">6,1" · Alumínio · Chip A18</text>
  <text x="880" y="1536" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#3E82F7" text-anchor="end">a partir de R$7.200</text>

  <!-- CTA Button -->
  <rect x="80" y="1556" width="380" height="70" rx="35" fill="#3E82F7"/>
  <text x="270" y="1599" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#07070E" text-anchor="middle">manda mensagem →</text>

  <!-- Footer -->
  <line x1="80" y1="1638" x2="1000" y2="1638" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1670" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="5">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="1670" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
