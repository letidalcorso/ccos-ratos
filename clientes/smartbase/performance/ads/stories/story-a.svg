<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
    <!-- GRADIENTE: funde a foto com o fundo escuro -->
    <linearGradient id="photoFade" x1="0" y1="780" x2="0" y2="1180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07070E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07070E" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#07070E"/>

  <!--
    ═══════════════════════════════════════════════
    FOTO DO PRODUTO
    Substituir o bloco abaixo pela linha:
    <image href="fotos/nome-da-foto.jpg" x="0" y="0" width="1080" height="1100" preserveAspectRatio="xMidYMid slice"/>
    ═══════════════════════════════════════════════
  -->
  <rect x="0" y="0" width="1080" height="1100" fill="#0D0D1F"/>
  <rect x="440" y="490" width="200" height="120" rx="8" fill="#1A1A30"/>
  <text x="540" y="545" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#2E2E50" text-anchor="middle">foto do produto</text>
  <text x="540" y="568" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#252545" text-anchor="middle">caixa lacrada / entrega CXS</text>

  <!-- Gradient overlay: foto → fundo -->
  <rect x="0" y="780" width="1080" height="400" fill="url(#photoFade)"/>

  <!-- ─── CONTENT ZONE (y=1200–1680) ─── -->

  <!-- Badge -->
  <rect x="80" y="1200" width="192" height="30" rx="15" fill="#0A201A"/>
  <text x="176" y="1221" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1.5">VERIFICADO</text>

  <!-- Headline -->
  <text x="80" y="1305" font-family="'Inter', system-ui, sans-serif" font-size="84" font-weight="800" fill="#F2F2F6">Você não precisa</text>
  <text x="80" y="1400" font-family="'Inter', system-ui, sans-serif" font-size="84" font-weight="800" fill="#3E82F7">da Apple Store.</text>

  <!-- Prova em linha -->
  <text x="80" y="1454" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#7A7A96">✓ IMEI verificado · ✓ paga só quando o iPhone chega</text>

  <!-- Highlight: modelo de encomenda -->
  <rect x="80" y="1474" width="920" height="62" rx="12" fill="#0E1E3A"/>
  <text x="540" y="1513" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#3E82F7" text-anchor="middle">Você só paga quando o iPhone chega na sua mão.</text>

  <!-- CTA Button -->
  <rect x="80" y="1552" width="380" height="70" rx="35" fill="#3E82F7"/>
  <text x="270" y="1595" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#07070E" text-anchor="middle">manda mensagem →</text>

  <!-- Footer -->
  <line x1="80" y1="1638" x2="1000" y2="1638" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1670" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="5">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="1670" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
