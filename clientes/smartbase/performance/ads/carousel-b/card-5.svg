<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Subtle gradient -->
  <rect x="0" y="580" width="1080" height="500" fill="#0C0C1A" opacity="0.4"/>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">5 / 5</text>

  <!-- Accent line -->
  <rect x="80" y="112" width="80" height="6" rx="3" fill="#3E82F7"/>

  <!-- Seal badges -->
  <rect x="80" y="154" width="186" height="30" rx="15" fill="#0A201A"/>
  <text x="173" y="175" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  IMEI verificado</text>

  <rect x="280" y="154" width="140" height="30" rx="15" fill="#0A201A"/>
  <text x="350" y="175" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  Lacrado</text>

  <rect x="434" y="154" width="192" height="30" rx="15" fill="#0A201A"/>
  <text x="530" y="175" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  Garantia 1 ano</text>

  <!-- Main copy -->
  <text x="80" y="306" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">Você escolhe</text>
  <text x="80" y="382" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">o modelo.</text>
  <text x="80" y="464" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#3E82F7">A gente verifica</text>
  <text x="80" y="546" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="800" fill="#3E82F7">na sua frente.</text>

  <!-- Divider -->
  <line x1="80" y1="582" x2="1000" y2="582" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="626" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#7A7A96">Sem risco. Sem surpresa depois. Sem precisar confiar cego.</text>

  <!-- Pagamento destaque -->
  <rect x="80" y="648" width="920" height="54" rx="10" fill="#0E1E3A"/>
  <text x="540" y="682" font-family="'Inter', system-ui, sans-serif" font-size="21" font-weight="700" fill="#3E82F7" text-anchor="middle">Você só paga quando o iPhone chega na sua mão.</text>

  <!-- CTA Button -->
  <rect x="80" y="722" width="340" height="64" rx="32" fill="#3E82F7"/>
  <text x="250" y="762" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#07070E" text-anchor="middle">manda mensagem →</text>

  <!-- Footer divider -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
