<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Ghost numeral texture -->
  <text x="680" y="780" font-family="'Inter', system-ui, sans-serif" font-size="500" font-weight="800" fill="#3E82F7" opacity="0.04" text-anchor="middle">17</text>

  <!-- Pilar pill -->
  <rect x="80" y="80" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Accent line -->
  <rect x="80" y="130" width="80" height="6" rx="3" fill="#3E82F7"/>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">1 / 5</text>

  <!-- Hook line 1 -->
  <text x="80" y="258" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">Você já sabe</text>
  <text x="80" y="344" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">qual iPhone quer.</text>

  <!-- Divider -->
  <line x1="80" y1="384" x2="600" y2="384" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Hook line 2 — dor -->
  <text x="80" y="444" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="400" fill="#7A7A96">O que falta é saber onde</text>
  <text x="80" y="496" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="600" fill="#C0C0D0">comprar sem risco.</text>

  <!-- Model list block -->
  <rect x="80" y="546" width="920" height="130" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="546" width="5" height="130" rx="2.5" fill="#3E82F7"/>

  <text x="118" y="588" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">iPhone 17 Pro Max · iPhone 17 Pro · iPhone 17</text>
  <text x="118" y="624" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">Todos lacrados · verificados · a partir de R$7.200 · CXS e Brasil</text>
  <text x="118" y="656" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#3E82F7">arrasta pra ver cada modelo →</text>

  <!-- Footer divider -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
