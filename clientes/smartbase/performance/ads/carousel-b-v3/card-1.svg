<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Counter -->
  <text x="1000" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">1 / 4</text>

  <!-- Label produto -->
  <text x="80" y="196" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#7A7A96">iPhone 17 Pro Max · lacrado · original</text>

  <!-- Preço gigante como herói visual -->
  <text x="80" y="360" font-family="'Inter', system-ui, sans-serif" font-size="140" font-weight="900" fill="#F2F2F6">R$9.200</text>

  <!-- Accent line -->
  <rect x="80" y="382" width="920" height="4" rx="2" fill="#3E82F7"/>

  <!-- Comparação -->
  <text x="80" y="440" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400" fill="#7A7A96">enquanto a Apple Store cobra </text>
  <text x="80" y="474" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="700" fill="#C0C0D0">R$12.999 pelo mesmo iPhone.</text>

  <!-- Divider -->
  <line x1="80" y1="524" x2="1000" y2="524" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub desejo -->
  <text x="80" y="586" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="#F2F2F6">o iPhone que você quer</text>
  <text x="80" y="634" font-family="'Inter', system-ui, sans-serif" font-size="36" font-weight="700" fill="#3E82F7">existe por esse valor.</text>

  <!-- Swipe -->
  <text x="80" y="712" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#3E82F7">arrasta pra entender por quê →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
