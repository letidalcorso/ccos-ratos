<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Color block verde sutil no topo -->
  <rect x="0" y="0" width="1080" height="8" fill="#10B981"/>

  <!-- Pilar pill autoridade -->
  <rect x="80" y="72" width="136" height="28" rx="14" fill="#0A201A"/>
  <text x="148" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1.5">AUTORIDADE</text>

  <!-- Counter -->
  <text x="1000" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">3 / 4</text>

  <!-- Accent line verde -->
  <rect x="80" y="128" width="64" height="5" rx="2.5" fill="#10B981"/>

  <!-- Headline objeção eliminada -->
  <text x="80" y="260" font-family="'Inter', system-ui, sans-serif" font-size="76" font-weight="800" fill="#F2F2F6">IMEI</text>
  <text x="80" y="348" font-family="'Inter', system-ui, sans-serif" font-size="76" font-weight="800" fill="#F2F2F6">verificável</text>
  <text x="80" y="436" font-family="'Inter', system-ui, sans-serif" font-size="76" font-weight="800" fill="#10B981">antes de pagar.</text>

  <!-- Divider -->
  <line x1="80" y1="476" x2="1000" y2="476" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Explicação -->
  <text x="80" y="534" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400" fill="#7A7A96">você digita o número no site da Apple</text>
  <text x="80" y="570" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="400" fill="#7A7A96">e confirma a originalidade. só então paga.</text>

  <!-- Seals -->
  <rect x="80" y="616" width="188" height="38" rx="19" fill="#0A201A"/>
  <text x="174" y="641" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  IMEI verificável</text>

  <rect x="284" y="616" width="148" height="38" rx="19" fill="#0A201A"/>
  <text x="358" y="641" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  Lacrado</text>

  <rect x="448" y="616" width="220" height="38" rx="19" fill="#0A201A"/>
  <text x="558" y="641" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">✓  Garantia Apple 1 ano</text>

  <!-- Swipe -->
  <text x="80" y="722" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#3E82F7">próximo →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
