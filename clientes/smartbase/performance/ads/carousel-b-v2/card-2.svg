<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Ghost texture -->
  <text x="660" y="780" font-family="'Inter', system-ui, sans-serif" font-size="520" font-weight="800" fill="#3E82F7" opacity="0.04" text-anchor="middle">17</text>

  <!-- Pilar pill -->
  <rect x="80" y="80" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Counter -->
  <text x="1000" y="99" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">2 / 4</text>

  <!-- Accent line -->
  <rect x="80" y="128" width="64" height="5" rx="2.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="290" font-family="'Inter', system-ui, sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">Direto de quem</text>
  <text x="80" y="390" font-family="'Inter', system-ui, sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">abastece as</text>
  <text x="80" y="490" font-family="'Inter', system-ui, sans-serif" font-size="88" font-weight="800" fill="#3E82F7">lojas daqui.</text>

  <!-- Divider -->
  <line x1="80" y1="530" x2="920" y2="530" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="582" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">sem margem de lojista. o mesmo iPhone,</text>
  <text x="80" y="618" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">a um preço mais justo.</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
