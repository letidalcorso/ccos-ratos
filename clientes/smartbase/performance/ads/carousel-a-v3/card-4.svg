<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Glow sutil -->
  <ellipse cx="540" cy="500" rx="420" ry="340" fill="#3E82F7" opacity="0.05"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Counter -->
  <text x="1000" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">4 / 4</text>

  <!-- Accent line -->
  <rect x="80" y="128" width="64" height="5" rx="2.5" fill="#3E82F7"/>

  <!-- CTA headline grande -->
  <text x="80" y="310" font-family="'Inter', system-ui, sans-serif" font-size="104" font-weight="900" fill="#F2F2F6">manda</text>
  <text x="80" y="426" font-family="'Inter', system-ui, sans-serif" font-size="104" font-weight="900" fill="#3E82F7">mensagem.</text>

  <!-- Divider -->
  <line x1="80" y1="468" x2="1000" y2="468" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="528" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">entrega presencial · Caxias do Sul e região</text>
  <text x="80" y="568" font-family="'Inter', system-ui, sans-serif" font-size="26" font-weight="400" fill="#7A7A96">envio para o Brasil todo</text>

  <!-- CTA button -->
  <rect x="80" y="630" width="360" height="68" rx="34" fill="#3E82F7"/>
  <text x="260" y="672" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#07070E" text-anchor="middle">falar no WhatsApp →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
