<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1080" fill="#07070E"/>

  <!-- Color block superior -->
  <rect x="0" y="0" width="1080" height="420" fill="#0E1E3A"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="116" height="28" rx="14" fill="#1A3060"/>
  <text x="138" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Counter -->
  <text x="1000" y="91" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4A4A60" text-anchor="end">1 / 4</text>

  <!-- Headline no color block -->
  <text x="80" y="200" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#C0C0D0">o iPhone 17 Pro Max</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#F2F2F6">que você quer</text>
  <text x="80" y="336" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#F2F2F6">existe.</text>

  <!-- Divider entre color block e dark -->
  <line x1="80" y1="460" x2="1000" y2="460" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Linha de intriga -->
  <text x="80" y="534" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="700" fill="#F2F2F6">e custa menos</text>
  <text x="80" y="588" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="700" fill="#3E82F7">do que você imagina.</text>

  <!-- Sub -->
  <text x="80" y="652" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#7A7A96">lacrado · original · entrega em CXS e Brasil</text>

  <!-- Swipe cue -->
  <text x="80" y="730" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#3E82F7">arrasta pra entender →</text>

  <!-- Footer -->
  <line x1="80" y1="900" x2="1000" y2="900" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="936" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="936" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
