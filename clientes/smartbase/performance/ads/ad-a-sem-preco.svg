<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Ghost numeral texture -->
  <text x="600" y="820" font-family="'Inter', system-ui, sans-serif" font-size="520" font-weight="800" fill="#3E82F7" opacity="0.04" text-anchor="middle">17</text>

  <!-- Pilar pill: PRODUTO -->
  <rect x="80" y="98" width="116" height="28" rx="14" fill="#0E1E3A"/>
  <text x="138" y="117" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#3E82F7" text-anchor="middle" letter-spacing="1.5">PRODUTO</text>

  <!-- Accent line -->
  <rect x="80" y="160" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="290" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">o iPhone que</text>
  <text x="80" y="378" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">tá nas lojas</text>
  <text x="80" y="466" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">daqui vem de</text>
  <text x="80" y="554" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#3E82F7">algum lugar.</text>

  <!-- Sub-headline -->
  <text x="80" y="636" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="400" fill="#C0C0D0">a Smartbase é esse lugar.</text>

  <!-- Divider -->
  <line x1="80" y1="682" x2="920" y2="682" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Product info block -->
  <rect x="80" y="710" width="920" height="180" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="710" width="5" height="180" rx="2.5" fill="#3E82F7"/>

  <text x="124" y="760" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#F2F2F6">iPhone 17 Pro Max</text>
  <text x="124" y="798" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#7A7A96">lacrado · nota fiscal · garantia Apple 1 ano</text>

  <!-- Seals -->
  <rect x="124" y="826" width="168" height="30" rx="15" fill="#0A201A"/>
  <text x="208" y="847" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  IMEI verificável</text>

  <rect x="306" y="826" width="138" height="30" rx="15" fill="#0A201A"/>
  <text x="375" y="847" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  Nota fiscal</text>

  <rect x="458" y="826" width="148" height="30" rx="15" fill="#0A201A"/>
  <text x="532" y="847" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">✓  Lacrado</text>

  <!-- Body copy -->
  <text x="80" y="950" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="400" fill="#7A7A96">compra direto de quem abastece.</text>
  <text x="80" y="990" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="400" fill="#7A7A96">sem margem de lojista no meio.</text>

  <!-- CTA -->
  <text x="80" y="1072" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="600" fill="#3E82F7">manda mensagem →</text>
  <text x="80" y="1116" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#4A4A60">entrega presencial em Caxias do Sul e região</text>

  <!-- Footer divider -->
  <line x1="80" y1="1188" x2="1000" y2="1188" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="80" y="1222" font-family="'Inter', system-ui, sans-serif" font-size="24" fill="#F2F2F6">
    <tspan font-weight="300" fill="#C0C0D0">smart</tspan><tspan fill="#3E82F7" font-size="11" baseline-shift="4">●</tspan><tspan font-weight="700">base</tspan>
  </text>
  <text x="1000" y="1222" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
