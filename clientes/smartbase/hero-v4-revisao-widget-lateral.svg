<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
      .font-ui { font-family: 'Inter', system-ui, sans-serif; }
    </style>

    <!-- Hero ambient background gradient (no real photo — abstract dark mood) -->
    <radialGradient id="bg-ambient" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1f2228"/>
      <stop offset="55%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>

    <!-- Warm light pocket (left) -->
    <radialGradient id="warm-light" cx="20%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#c8945a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8945a" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool light pocket (right) -->
    <radialGradient id="cool-light" cx="80%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#5a8ec8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5a8ec8" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass tile (white, low opacity) -->
    <linearGradient id="glass-highlight" x1="0%" y1="0%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner contrast overlay (gradient bottom dark) -->
    <linearGradient id="contrast-overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Widget photo slot gradient (placeholder for iPhone) -->
    <radialGradient id="widget-photo-placeholder" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#d8845a" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#6a3e2a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1a1f" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="ambient-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- ============ BG (ambient dark scene) ============ -->
  <rect width="1440" height="1024" fill="url(#bg-ambient)"/>
  <ellipse cx="320" cy="380" rx="500" ry="500" fill="url(#warm-light)" filter="url(#ambient-blur)"/>
  <ellipse cx="1180" cy="600" rx="450" ry="450" fill="url(#cool-light)" filter="url(#ambient-blur)"/>

  <!-- ============ BROWSER BAR (top center, glass pill) ============ -->
  <g transform="translate(440, 88)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="560" height="42" rx="21" ry="21"
          fill="#ffffff" fill-opacity="0.14"
          stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
    <rect x="0" y="0" width="560" height="14" rx="21" ry="21" fill="url(#glass-highlight)"/>

    <!-- windows icon (grid 2x2) -->
    <g transform="translate(12, 14)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4">
      <rect x="2" y="2" width="4" height="4" rx="0.5"/>
      <rect x="8" y="2" width="4" height="4" rx="0.5"/>
      <rect x="2" y="8" width="4" height="4" rx="0.5"/>
      <rect x="8" y="8" width="4" height="4" rx="0.5"/>
    </g>
    <!-- back -->
    <polyline points="40,17 35,21 40,25" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fwd -->
    <polyline points="60,17 65,21 60,25" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Aa -->
    <text x="78" y="25" class="font-ui" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.75">Aa</text>

    <!-- URL pill inside -->
    <rect x="100" y="8" width="360" height="26" rx="13" ry="13"
          fill="#ffffff" fill-opacity="0.10"
          stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5"/>
    <!-- lock icon -->
    <g transform="translate(124, 14.5)" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2" stroke-linecap="round">
      <rect x="2" y="5" width="6" height="5" rx="1"/>
      <path d="M3.5,5 V3.5 a1.5,1.5 0 0 1 3,0 V5"/>
    </g>
    <text x="143" y="25" class="font-ui" font-size="11" font-weight="400" fill="#ffffff" fill-opacity="0.85">smartbasebr.com</text>

    <!-- reload -->
    <g transform="translate(468, 17)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="11,0 11,3 8,3"/>
      <path d="M11,3 A4.5,4.5 0 1 0 9.5,7.5"/>
    </g>
    <!-- share -->
    <g transform="translate(490, 17)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7,-1 V7"/>
      <polyline points="4.5,1.5 7,-1 9.5,1.5"/>
      <path d="M3,6 v2 a1,1 0 0 0 1,1 h6 a1,1 0 0 0 1,-1 V6"/>
    </g>
    <!-- plus -->
    <g transform="translate(512, 17)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round">
      <line x1="7" y1="0" x2="7" y2="8"/>
      <line x1="3" y1="4" x2="11" y2="4"/>
    </g>
    <!-- tabs -->
    <g transform="translate(534, 17)" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="0" width="8" height="8" rx="1"/>
      <line x1="3" y1="3" x2="11" y2="3"/>
    </g>
  </g>

  <!-- ============ SIDEBAR LEFT (vertical glass pill, 6 SVG icons, HOME active) ============ -->
  <g transform="translate(48, 361)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="58" height="302" rx="29" ry="29"
          fill="#ffffff" fill-opacity="0.12"
          stroke="#ffffff" stroke-opacity="0.26" stroke-width="1"/>
    <rect x="0" y="0" width="58" height="30" rx="29" ry="29" fill="url(#glass-highlight)"/>

    <!-- HOME active: pill background + border -->
    <rect x="8" y="10" width="42" height="42" rx="21" ry="21"
          fill="#ffffff" fill-opacity="0.22"
          stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.75"/>
    <g transform="translate(18, 20)" fill="none" stroke="#ffffff" stroke-opacity="1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,11 L12,4 L21,11 V20 a2,2 0 0 1 -2,2 h-4 v-7 h-6 v7 H5 a2,2 0 0 1 -2,-2 z" transform="scale(1)"/>
    </g>

    <!-- bag idle -->
    <g transform="translate(18, 68)" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6,7 h12 l-1,14 H7 z"/>
      <path d="M9,7 a3,3 0 1 1 6,0"/>
    </g>

    <!-- user idle -->
    <g transform="translate(18, 116)" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4,21 c0,-4 4,-7 8,-7 s8,3 8,7"/>
    </g>

    <!-- doc idle -->
    <g transform="translate(18, 164)" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14,3 H6 v18 h12 V7 z"/>
      <polyline points="14,3 14,7 18,7"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="13" y2="16"/>
    </g>

    <!-- help idle -->
    <g transform="translate(18, 212)" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.5,9 a2.5,2.5 0 0 1 5,0 c0,1.5 -2.5,2 -2.5,3.5"/>
      <circle cx="12" cy="16.5" r="0.5"/>
    </g>

    <!-- chat idle -->
    <g transform="translate(18, 260)" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,12 a9,9 0 0 1 18,0 a9,9 0 0 1 -9,9 c-1.5,0 -2.9,-0.4 -4.1,-1 L3,21 l1,-4.9 C3.4,14.9 3,13.5 3,12 z"/>
    </g>
  </g>

  <!-- ============ CONTENT CARD CENTRAL (1180x700 glass) ============ -->
  <g transform="translate(130, 200)" filter="url(#soft-shadow)">
    <!-- card body -->
    <rect x="0" y="0" width="1180" height="700" rx="32" ry="32"
          fill="#ffffff" fill-opacity="0.10"
          stroke="#ffffff" stroke-opacity="0.24" stroke-width="1"/>
    <!-- top highlight -->
    <rect x="0" y="0" width="1180" height="50" rx="32" ry="32" fill="url(#glass-highlight)"/>
    <!-- contrast overlay (bottom dark) -->
    <rect x="0" y="0" width="1180" height="700" rx="32" ry="32" fill="url(#contrast-overlay)"/>

    <!-- Badge "smartbase" top-left -->
    <g transform="translate(32, 32)">
      <rect x="0" y="0" width="94" height="29" rx="14.5" ry="14.5"
            fill="#ffffff" fill-opacity="0.18"
            stroke="#ffffff" stroke-opacity="0.32" stroke-width="0.75"/>
      <text x="14" y="20" class="font-ui" font-size="12" font-weight="500" fill="#ffffff" letter-spacing="0.5">smartbase</text>
    </g>

    <!-- ===== TEXT COLUMN LEFT ===== -->
    <!-- Subline (above headline) -->
    <text x="56" y="350" class="font-ui" font-size="18" font-weight="500"
          fill="#ffffff" fill-opacity="0.85">só paga quando o iphone tá na sua mão.</text>

    <!-- Headline (big) -->
    <text x="56" y="430" class="font-display" font-size="64" font-weight="700"
          fill="#ffffff" letter-spacing="-1.5">sua apple store.</text>
    <text x="56" y="500" class="font-display" font-size="64" font-weight="700"
          fill="#ffffff" letter-spacing="-1.5">particular.</text>

    <!-- Localização -->
    <text x="56" y="560" class="font-ui" font-size="14" font-weight="500"
          fill="#ffffff" fill-opacity="0.65" letter-spacing="0.3">serra gaúcha · entrega em caxias</text>

    <!-- CTA primary (clear glass) -->
    <g transform="translate(56, 600)">
      <rect x="0" y="0" width="177" height="44" rx="22" ry="22"
            fill="#ffffff" fill-opacity="0.95"/>
      <text x="22" y="28" class="font-ui" font-size="14" font-weight="600" fill="#0a0a0f">quero ver a vitrine</text>
      <text x="153" y="28" class="font-ui" font-size="14" font-weight="600" fill="#0a0a0f">→</text>
    </g>

    <!-- CTA secondary (dark glass) -->
    <g transform="translate(243, 600)">
      <rect x="0" y="0" width="164" height="44" rx="22" ry="22"
            fill="#000000" fill-opacity="0.24"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5"/>
      <text x="22" y="28" class="font-ui" font-size="14" font-weight="500" fill="#ffffff" fill-opacity="0.95">falar no whatsapp</text>
    </g>

    <!-- ===== WIDGET PRODUTO DESTAQUE (RIGHT) — 540x440 ===== -->
    <g transform="translate(600, 130)" filter="url(#soft-shadow)">
      <!-- widget glass body -->
      <rect x="0" y="0" width="540" height="440" rx="28" ry="28"
            fill="#ffffff" fill-opacity="0.14"
            stroke="#ffffff" stroke-opacity="0.28" stroke-width="1"/>
      <rect x="0" y="0" width="540" height="40" rx="28" ry="28" fill="url(#glass-highlight)"/>

      <!-- photo slot (placeholder gradient) — 540x290 -->
      <rect x="0" y="0" width="540" height="290" rx="28" ry="28" fill="#0c0c10"/>
      <rect x="0" y="0" width="540" height="290" rx="28" ry="28" fill="url(#widget-photo-placeholder)"/>
      <!-- iPhone silhouette suggestion -->
      <rect x="220" y="60" width="100" height="180" rx="20" ry="20"
            fill="#c8744a" fill-opacity="0.45"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5"/>
      <rect x="245" y="70" width="50" height="20" rx="6" ry="6"
            fill="#000000" fill-opacity="0.6"/>

      <!-- Live badge top-left of photo -->
      <g transform="translate(16, 16)">
        <rect x="0" y="0" width="124" height="22" rx="11" ry="11"
              fill="#000000" fill-opacity="0.45"
              stroke="#ffffff" stroke-opacity="0.20" stroke-width="0.5"/>
        <circle cx="13" cy="11" r="3" fill="#73d88c"/>
        <text x="22" y="15" class="font-ui" font-size="10" font-weight="500" fill="#ffffff" fill-opacity="0.9">disponível agora</text>
      </g>

      <!-- Drop hint (small) -->
      <g transform="translate(212, 252)">
        <rect x="0" y="0" width="116" height="22" rx="6" ry="6"
              fill="#ffffff" fill-opacity="0.05"
              stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.5"
              stroke-dasharray="4 4"/>
        <text x="58" y="15" class="font-ui" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.35" text-anchor="middle">↑ drop iPhone 17 Pro</text>
      </g>

      <!-- Info section (bottom of widget) — 540x150 -->
      <g transform="translate(20, 310)">
        <text x="0" y="14" class="font-ui" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.5">destaque do mês</text>
        <text x="0" y="50" class="font-display" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">iPhone 17 Pro</text>
        <text x="0" y="78" class="font-ui" font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.65">256GB · cosmic orange · lacrado · garantia apple oficial</text>
        <!-- mini CTA -->
        <text x="0" y="118" class="font-ui" font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.95">ver detalhes  →</text>
      </g>
    </g>
  </g>

  <!-- ============ SPOILER STRIP (próximo bloco) ============ -->
  <g transform="translate(512, 950)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="416" height="31" rx="15" ry="15"
          fill="#ffffff" fill-opacity="0.08"
          stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.5"/>
    <text x="18" y="20" class="font-ui" font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.55">↓</text>
    <text x="42" y="20" class="font-ui" font-size="12" font-weight="500" fill="#ffffff" fill-opacity="0.75">tudo apple.</text>
    <text x="120" y="20" class="font-ui" font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.35">·</text>
    <text x="135" y="20" class="font-ui" font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.45">iPhone, Mac, iPad, Watch, AirPods</text>
  </g>

  <!-- ============ PAGE INDICATOR DOTS ============ -->
  <g transform="translate(699, 1005)">
    <rect x="0" y="0" width="20" height="5" rx="2.5" ry="2.5" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="26" y="0" width="5" height="5" rx="2.5" ry="2.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="37" y="0" width="5" height="5" rx="2.5" ry="2.5" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
