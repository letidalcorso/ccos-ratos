<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
    <radialGradient id="glowS2" cx="50%" cy="24%" r="60%">
      <stop offset="0" stop-color="#3E82F7" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#3E82F7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3E82F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMini" cx="50%" cy="34%" r="62%">
      <stop offset="0" stop-color="#3E82F7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3E82F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="#07070E"/>
  <rect width="1080" height="1920" fill="url(#glowS2)"/>
  <rect x="0" y="0" width="4" height="1920" fill="#3E82F7"/>

  <!-- badge -->
  <rect x="80" y="250" width="167" height="40" rx="14" fill="#0E1E3A"/>
  <text x="98" y="277" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#3E82F7" letter-spacing="2">DECIFRA APPLE</text>

  <!-- headline -->
  <text x="80" y="520" font-family="Bricolage Grotesque, sans-serif" font-size="84" font-weight="800" fill="#F2F2F6">a resposta tá</text>
  <text x="80" y="616" font-family="Bricolage Grotesque, sans-serif" font-size="84" font-weight="800" fill="#F2F2F6">no <tspan fill="#3E82F7">feed</tspan>. já foi.</text>

  <!-- sub -->
  <text x="80" y="724" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#C7C7D6">os 4 craques, os 4 produtos e o porquê</text>
  <text x="80" y="772" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#C7C7D6">de cada um. arrasta lá e descobre quem é quem.</text>

  <!-- mock post thumbnail (mini-cover) -->
  <g>
    <rect x="340" y="846" width="400" height="500" rx="28" fill="#0B0B14" stroke="#2A2A40" stroke-width="1.5"/>
    <rect x="340" y="846" width="400" height="500" rx="28" fill="url(#glowMini)"/>
    <rect x="340" y="846" width="4" height="500" rx="2" fill="#3E82F7"/>
    <!-- mini badge -->
    <rect x="372" y="892" width="120" height="30" rx="10" fill="#0E1E3A"/>
    <text x="386" y="913" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#3E82F7" letter-spacing="1.5">DECIFRA APPLE</text>
    <!-- mini headline -->
    <text x="372" y="1150" font-family="Bricolage Grotesque, sans-serif" font-size="38" font-weight="800" fill="#F2F2F6">e se a seleção</text>
    <text x="372" y="1196" font-family="Bricolage Grotesque, sans-serif" font-size="38" font-weight="800" fill="#F2F2F6">fosse da <tspan fill="#3E82F7">apple</tspan>?</text>
    <!-- carousel dots -->
    <circle cx="372" cy="1280" r="5" fill="#3E82F7"/>
    <circle cx="392" cy="1280" r="5" fill="#3A3A52"/>
    <circle cx="412" cy="1280" r="5" fill="#3A3A52"/>
    <circle cx="432" cy="1280" r="5" fill="#3A3A52"/>
    <circle cx="452" cy="1280" r="5" fill="#3A3A52"/>
    <text x="708" y="1286" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#9A9AB2" text-anchor="end">1 / 5</text>
  </g>

  <!-- cta pill -->
  <rect x="290" y="1420" width="500" height="86" rx="43" fill="#3E82F7"/>
  <text x="540" y="1472" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#07070E" text-anchor="middle">toca pra ver o post  →</text>

  <!-- whisper brand line -->
  <text x="540" y="1592" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#7A7A96" text-anchor="middle">original · garantia internacional · tu só paga quando recebe</text>

  <!-- footer -->
  <g transform="translate(80,1770)">
    <rect x="0" y="-22" width="46" height="32" rx="15" fill="#0F0F1C"/>
    <text x="23" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#3E82F7" text-anchor="middle">sb</text>
    <text x="60" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="300" fill="#C0C0D0">smart</text>
    <circle cx="121" cy="-6" r="4" fill="#3E82F7"/>
    <text x="130" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#F2F2F6">base</text>
  </g>
  <text x="1000" y="1770" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#9A9AB2" text-anchor="end">@smartbase.br</text>
</svg>
