<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
    <radialGradient id="glowF" cx="50%" cy="30%" r="58%">
      <stop offset="0" stop-color="#3E82F7" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#3E82F7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3E82F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect width="1080" height="1350" fill="url(#glowF)"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- badge -->
  <rect x="80" y="98" width="167" height="40" rx="14" fill="#0E1E3A"/>
  <text x="98" y="125" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#3E82F7" letter-spacing="2">DECIFRA APPLE</text>

  <!-- kicker -->
  <text x="80" y="388" font-family="Inter, sans-serif" font-size="30" font-weight="600" fill="#7A7A96">essa foi a nossa escalação.</text>

  <!-- headline -->
  <text x="80" y="520" font-family="Bricolage Grotesque, sans-serif" font-size="92" font-weight="800" fill="#F2F2F6">monta a tua</text>
  <text x="80" y="618" font-family="Bricolage Grotesque, sans-serif" font-size="92" font-weight="800" fill="#F2F2F6">seleção <tspan fill="#3E82F7">apple</tspan>.</text>

  <!-- body -->
  <text x="80" y="742" font-family="Inter, sans-serif" font-size="30" font-weight="400" fill="#C7C7D6">a smartbase monta teu time — iphone, mac, watch,</text>
  <text x="80" y="786" font-family="Inter, sans-serif" font-size="30" font-weight="400" fill="#C7C7D6">tudo original e com garantia internacional.</text>
  <text x="80" y="830" font-family="Inter, sans-serif" font-size="30" font-weight="600" fill="#F2F2F6">e tu só paga quando recebe na mão.</text>

  <!-- cta button -->
  <rect x="80" y="900" width="624" height="86" rx="43" fill="#3E82F7"/>
  <text x="392" y="952" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#07070E" text-anchor="middle">manda "seleção" no direct  →</text>

  <!-- quiet brand line -->
  <text x="80" y="1066" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#7A7A96">sua apple store. particular.</text>

  <!-- footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#2A2A40" stroke-width="1" opacity="0.6"/>
  <g transform="translate(80,1276)">
    <rect x="0" y="-22" width="46" height="32" rx="15" fill="#0F0F1C"/>
    <text x="23" y="0" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#3E82F7" text-anchor="middle">sb</text>
    <text x="60" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="300" fill="#C0C0D0">smart</text>
    <circle cx="121" cy="-6" r="4" fill="#3E82F7"/>
    <text x="130" y="0" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#F2F2F6">base</text>
  </g>
  <text x="1000" y="1276" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#9A9AB2" text-anchor="end">@smartbase.br</text>
</svg>
