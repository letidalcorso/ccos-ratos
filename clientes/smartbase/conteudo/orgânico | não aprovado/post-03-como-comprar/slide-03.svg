<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#10B981"/>

  <!-- Numeral fantasma -->
  <text x="980" y="820" font-family="'Bricolage Grotesque', sans-serif" font-size="480" font-weight="900" fill="#10B981" opacity="0.06" text-anchor="end">2</text>

  <!-- Label + Counter -->
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#10B981" letter-spacing="1.5">AUTORIDADE</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">3/4</text>

  <!-- Accent Line -->
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#10B981"/>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">a gente indica</text>
  <text x="80" y="372" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#10B981">o modelo certo.</text>

  <!-- Body -->
  <text x="80" y="472" font-family="'Inter', sans-serif" font-size="30" font-weight="400" fill="#C0C0D0">novo ou seminovo.</text>
  <text x="80" y="514" font-family="'Inter', sans-serif" font-size="30" font-weight="400" fill="#7A7A96">dentro do seu orçamento.</text>
  <text x="80" y="556" font-family="'Inter', sans-serif" font-size="30" font-weight="400" fill="#7A7A96">com garantia em dia.</text>

  <!-- Highlight Box -->
  <rect x="80" y="620" width="920" height="90" rx="6" fill="#0A201A"/>
  <rect x="80" y="620" width="5" height="90" fill="#10B981"/>
  <text x="114" y="655" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#C0C0D0">a gente conhece cada modelo.</text>
  <text x="114" y="691" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#7A7A96">não vai te mandar o errado.</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
