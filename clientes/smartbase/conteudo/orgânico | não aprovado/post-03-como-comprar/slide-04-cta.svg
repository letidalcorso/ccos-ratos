<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#10B981"/>

  <!-- Numeral fantasma -->
  <text x="980" y="820" font-family="'Bricolage Grotesque', sans-serif" font-size="480" font-weight="900" fill="#10B981" opacity="0.06" text-anchor="end">3</text>

  <!-- Label + Counter -->
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#10B981" letter-spacing="1.5">AUTORIDADE</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">4/4</text>

  <!-- Accent Line -->
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#10B981"/>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">chega nas</text>
  <text x="80" y="372" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#10B981">suas mãos.</text>

  <!-- Sub -->
  <text x="80" y="466" font-family="'Inter', sans-serif" font-size="32" font-weight="500" fill="#C0C0D0">configurado. pronto pra usar.</text>

  <!-- Body -->
  <text x="80" y="556" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="#7A7A96">é assim que funciona desde sempre.</text>

  <!-- CTA Button -->
  <rect x="80" y="650" width="400" height="64" rx="32" fill="#10B981"/>
  <text x="280" y="691" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#07070E" text-anchor="middle">manda mensagem agora →</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
