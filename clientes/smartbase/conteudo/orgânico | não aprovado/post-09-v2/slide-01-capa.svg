<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- PLACEHOLDER IMAGEM DE FUNDO -->
  <rect x="0" y="0" width="1080" height="1350" fill="#0C0C18" stroke="#1E1E2E" stroke-width="2" stroke-dasharray="16,10" opacity="0.5"/>
  <text x="540" y="1160" font-family="'Inter', sans-serif" font-size="16" fill="#252538" text-anchor="middle">[ imagem de fundo — iPhone 17, detalhe câmera ou titanio ]</text>

  <!-- Gradiente escuro na parte inferior pra texto respirar -->
  <rect x="0" y="600" width="1080" height="750" fill="#07070E" opacity="0.75"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Pilar Pill + Counter -->
  <rect x="80" y="98" width="112" height="28" rx="14" fill="#0E1E3A"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">1/5</text>

  <!-- Accent Line -->
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="780" font-family="'Bricolage Grotesque', sans-serif" font-size="110" font-weight="800" fill="#F2F2F6">você merece</text>
  <text x="80" y="900" font-family="'Bricolage Grotesque', sans-serif" font-size="110" font-weight="800" fill="#3E82F7">o melhor.</text>

  <!-- Sub -->
  <text x="80" y="980" font-family="'Inter', sans-serif" font-size="36" font-weight="300" fill="#C0C0D0">(de verdade.)</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
