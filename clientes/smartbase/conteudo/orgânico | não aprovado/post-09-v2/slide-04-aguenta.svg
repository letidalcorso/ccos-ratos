<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Numeral fantasma -->
  <text x="980" y="860" font-family="'Bricolage Grotesque', sans-serif" font-size="520" font-weight="900" fill="#3E82F7" opacity="0.05" text-anchor="end">4</text>

  <!-- Label + Counter -->
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">4/5</text>
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">e aguenta</text>
  <text x="80" y="368" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#3E82F7">o ritmo.</text>

  <!-- Itens -->
  <rect x="80" y="440" width="920" height="72" rx="6" fill="#0E1E3A"/>
  <rect x="80" y="440" width="5" height="72" fill="#3E82F7"/>
  <text x="110" y="472" font-family="'Inter', sans-serif" font-size="26" font-weight="600" fill="#F2F2F6">dia inteiro de bateria.</text>
  <text x="110" y="500" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#7A7A96">sem aquele ansiedade de chegador em 30%.</text>

  <rect x="80" y="530" width="920" height="72" rx="6" fill="#0F0F1C"/>
  <rect x="80" y="530" width="5" height="72" fill="#3E82F7"/>
  <text x="110" y="562" font-family="'Inter', sans-serif" font-size="26" font-weight="600" fill="#F2F2F6">tela que vence sol forte.</text>
  <text x="110" y="590" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#7A7A96">lê até no meio do verão, do lado de fora.</text>

  <rect x="80" y="620" width="920" height="72" rx="6" fill="#0F0F1C"/>
  <rect x="80" y="620" width="5" height="72" fill="#3E82F7"/>
  <text x="110" y="652" font-family="'Inter', sans-serif" font-size="26" font-weight="600" fill="#F2F2F6">titânio que pesa menos e dura mais.</text>
  <text x="110" y="680" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#7A7A96">não é luxo. é escolha inteligente.</text>

  <!-- Destaque final -->
  <text x="80" y="790" font-family="'Bricolage Grotesque', sans-serif" font-size="40" font-weight="700" fill="#C0C0D0">ferramenta de quem trabalha.</text>
  <text x="80" y="842" font-family="'Bricolage Grotesque', sans-serif" font-size="40" font-weight="700" fill="#7A7A96">não brinquedo.</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
