  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- PLACEHOLDER imagem de fundo -->
  <rect x="0" y="0" width="1080" height="1350" fill="#0C0C18" stroke="#1E1E2E" stroke-width="2" stroke-dasharray="16,10" opacity="0.4"/>
  <text x="540" y="1160" font-family="'Inter', sans-serif" font-size="16" fill="#252538" text-anchor="middle">[ imagem de fundo — produto ou ambiente ]</text>
  <rect x="0" y="500" width="1080" height="850" fill="#07070E" opacity="0.8"/>

  <!-- Label + Counter -->
