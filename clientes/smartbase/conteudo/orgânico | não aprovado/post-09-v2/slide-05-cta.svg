  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">5/5</text>
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="600" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">você chegou</text>
  <text x="80" y="688" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">até aqui.</text>
  <text x="80" y="800" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="700" fill="#C0C0D0">agora é só escolher</text>
  <text x="80" y="872" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="700" fill="#3E82F7">quem entrega.</text>

  <!-- Selos -->
  <rect x="80" y="940" width="200" height="34" rx="17" fill="#0A201A"/>
  <text x="103" y="963" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  garantia</text>

  <rect x="296" y="940" width="220" height="34" rx="17" fill="#0A201A"/>
  <text x="319" y="963" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  nota fiscal</text>

  <rect x="532" y="940" width="256" height="34" rx="17" fill="#0A201A"/>
  <text x="555" y="963" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  suporte direto</text>

  <!-- Body -->
  <text x="80" y="1040" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#7A7A96">sem importação, sem dor de cabeça.</text>

  <!-- CTA Button -->
  <rect x="80" y="1090" width="340" height="60" rx="30" fill="#3E82F7"/>
