<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Numeral fantasma -->
  <text x="980" y="860" font-family="'Bricolage Grotesque', sans-serif" font-size="520" font-weight="900" fill="#3E82F7" opacity="0.05" text-anchor="end">2</text>

  <!-- Label + Counter -->
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">2/5</text>
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="310" font-family="'Bricolage Grotesque', sans-serif" font-size="72" font-weight="800" fill="#7A7A96">"merecer o melhor"</text>
  <text x="80" y="396" font-family="'Bricolage Grotesque', sans-serif" font-size="72" font-weight="800" fill="#7A7A96">virou desculpa</text>
  <text x="80" y="482" font-family="'Bricolage Grotesque', sans-serif" font-size="72" font-weight="800" fill="#7A7A96">pra gastar.</text>

  <!-- Divider -->
  <line x1="80" y1="540" x2="920" y2="540" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Reframe -->
  <text x="80" y="620" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#F2F2F6">deveria ser</text>
  <text x="80" y="700" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#F2F2F6">reconhecimento</text>
  <text x="80" y="780" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#3E82F7">de quanto você</text>
  <text x="80" y="860" font-family="'Bricolage Grotesque', sans-serif" font-size="60" font-weight="800" fill="#3E82F7">produz.</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
