<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>
  <!-- Left accent -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>
  <!-- Ghost text -->
  <text x="1080" y="820" font-family="'Bricolage Grotesque', sans-serif" font-size="520" font-weight="800" fill="#F2F2F6" opacity="0.03" text-anchor="end">17</text>

  <!-- Label badge -->
  <rect x="80" y="72" width="160" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="160" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">PRODUTO</text>
  <!-- Slide counter -->
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">1 / 9</text>

  <!-- Model index -->
  <text x="80" y="200" font-family="'Inter', sans-serif" font-size="22" font-weight="300" fill="#4A4A60">iphone 17e  ·  iphone 17  ·  iphone 17 pro max</text>
  <text x="80" y="236" font-family="'Inter', sans-serif" font-size="22" font-weight="300" fill="#4A4A60">apple watch se 3  ·  apple watch ultra 3</text>

  <!-- Main headline -->
  <text x="80" y="440" font-family="'Bricolage Grotesque', sans-serif" font-size="108" font-weight="800" fill="#F2F2F6">essa linha</text>
  <text x="80" y="560" font-family="'Bricolage Grotesque', sans-serif" font-size="108" font-weight="800" fill="#F2F2F6">não precisa</text>
  <text x="80" y="680" font-family="'Bricolage Grotesque', sans-serif" font-size="108" font-weight="800" fill="#3E82F7">de apresentação.</text>

  <!-- Divider -->
  <line x1="80" y1="730" x2="1000" y2="730" stroke="#1A1A2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="790" font-family="'Inter', sans-serif" font-size="30" font-weight="300" fill="#7A7A96">originais. direto no seu whatsapp.</text>

  <!-- Swipe hint -->
  <text x="1000" y="1220" font-family="'Inter', sans-serif" font-size="24" fill="#4A4A60" text-anchor="end">deslize →</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
