<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background — slightly warmer dark for the Ultra -->
  <rect width="1080" height="1350" fill="#08070A"/>
  <!-- Left accent — titanium/gold tone for Ultra -->
  <rect x="0" y="0" width="4" height="1350" fill="#A8A196"/>
  <!-- Ghost text -->
  <text x="1080" y="960" font-family="'Bricolage Grotesque', sans-serif" font-size="280" font-weight="800" fill="#F2F2F6" opacity="0.025" text-anchor="end">ULTRA</text>

  <!-- Label badge — titanium-toned -->
  <rect x="80" y="72" width="228" height="40" rx="20" fill="#0F0F0E" stroke="#A8A196" stroke-width="1"/>
  <text x="194" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#A8A196" text-anchor="middle" letter-spacing="2">WATCH ULTRA 3</text>
  <!-- Slide counter -->
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">7 / 9</text>

  <!-- Product render placeholder -->
  <rect x="240" y="150" width="600" height="700" rx="24" fill="#0D0D0B" stroke="#2A2A24" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="540" y="490" font-family="'Inter', sans-serif" font-size="18" fill="#2A2A40" text-anchor="middle">render do produto</text>
  <text x="540" y="518" font-family="'Inter', sans-serif" font-size="14" fill="#1E1E34" text-anchor="middle">apple.com/br/shop/buy-watch</text>
  <!-- Color dots hint -->
  <circle cx="500" cy="580" r="16" fill="#1A1A18" stroke="#3A3A30" stroke-width="1" opacity="0.9"/>
  <circle cx="554" cy="580" r="16" fill="#A8A196" opacity="0.8"/>
  <text x="540" y="618" font-family="'Inter', sans-serif" font-size="13" fill="#2A2A40" text-anchor="middle">black titanium · natural titanium</text>

  <!-- Product name -->
  <text x="80" y="980" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">Apple Watch</text>
  <text x="80" y="1058" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#A8A196">Ultra 3.</text>

  <!-- Tagline -->
  <text x="80" y="1115" font-family="'Inter', sans-serif" font-size="30" font-weight="300" fill="#7A7A96">Construído para não parar.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F0E"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#A8A196" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
