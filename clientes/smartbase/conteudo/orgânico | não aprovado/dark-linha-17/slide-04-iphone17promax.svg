<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>
  <!-- Left accent -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>
  <!-- Ghost text -->
  <text x="1080" y="1000" font-family="'Bricolage Grotesque', sans-serif" font-size="300" font-weight="800" fill="#F2F2F6" opacity="0.025" text-anchor="end">PRO</text>

  <!-- Label badge -->
  <rect x="80" y="72" width="270" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="215" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">iPHONE 17 PRO MAX</text>
  <!-- Slide counter -->
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">4 / 9</text>

  <!-- Product render placeholder -->
  <rect x="240" y="130" width="600" height="820" rx="20" fill="#0D0D1A" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="540" y="530" font-family="'Inter', sans-serif" font-size="18" fill="#2A2A40" text-anchor="middle">render do produto</text>
  <text x="540" y="558" font-family="'Inter', sans-serif" font-size="14" fill="#1E1E34" text-anchor="middle">apple.com/br/iphone/iphone-17-pro</text>
  <!-- Color dots hint -->
  <circle cx="470" cy="610" r="16" fill="#FF6B30" opacity="0.8"/>
  <circle cx="520" cy="610" r="16" fill="#1A2844" stroke="#3E82F7" stroke-width="1" opacity="0.9"/>
  <circle cx="570" cy="610" r="16" fill="#C8C8CC" opacity="0.7"/>
  <text x="540" y="648" font-family="'Inter', sans-serif" font-size="13" fill="#2A2A40" text-anchor="middle">cosmic orange · deep blue · silver</text>

  <!-- Product name -->
  <text x="80" y="1040" font-family="'Bricolage Grotesque', sans-serif" font-size="76" font-weight="800" fill="#F2F2F6">iPhone 17</text>
  <text x="80" y="1110" font-family="'Bricolage Grotesque', sans-serif" font-size="76" font-weight="800" fill="#3E82F7">Pro Max.</text>

  <!-- Tagline -->
  <text x="80" y="1162" font-family="'Inter', sans-serif" font-size="30" font-weight="300" fill="#7A7A96">Sem concessão.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
