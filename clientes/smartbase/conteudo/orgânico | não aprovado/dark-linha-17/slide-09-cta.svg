<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#06080F"/>
  <!-- Left accent -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>
  <!-- Background glow -->
  <ellipse cx="800" cy="600" rx="500" ry="500" fill="#3E82F7" opacity="0.03"/>

  <!-- Ghost text -->
  <text x="-80" y="1100" font-family="'Bricolage Grotesque', sans-serif" font-size="500" font-weight="800" fill="#3E82F7" opacity="0.03">→</text>

  <!-- Label badge -->
  <rect x="80" y="72" width="185" height="40" rx="20" fill="rgba(62,130,247,0.1)" stroke="rgba(62,130,247,0.3)" stroke-width="1"/>
  <text x="172" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#6DAFF9" text-anchor="middle" letter-spacing="2">ENCOMENDE</text>
  <!-- Slide counter -->
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="rgba(242,242,246,0.2)" text-anchor="end">9 / 9</text>

  <!-- Main CTA -->
  <text x="80" y="420" font-family="'Bricolage Grotesque', sans-serif" font-size="130" font-weight="800" fill="#F2F2F6">Escolheu?</text>

  <!-- Divider -->
  <line x1="80" y1="470" x2="1000" y2="470" stroke="rgba(62,130,247,0.2)" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="540" font-family="'Inter', sans-serif" font-size="34" font-weight="300" fill="#7A7A96">fala com a gente pelo WhatsApp.</text>

  <!-- WhatsApp CTA block -->
  <rect x="80" y="640" width="920" height="100" rx="50" fill="#3E82F7"/>
  <text x="540" y="700" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="800" fill="#F2F2F6" text-anchor="middle">→ abrir WhatsApp</text>

  <!-- Reassurance -->
  <text x="540" y="790" font-family="'Inter', sans-serif" font-size="24" fill="rgba(242,242,246,0.25)" text-anchor="middle">resposta rápida · produto original · entrega pra todo o brasil</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="rgba(62,130,247,0.15)" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="rgba(62,130,247,0.1)"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="rgba(242,242,246,0.2)" text-anchor="end">@smartbase.br</text>
</svg>
