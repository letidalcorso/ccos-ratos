<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- PLACEHOLDER DE IMAGEM — lifestyle ou produto -->
  <rect x="0" y="0" width="1080" height="1350" fill="#0C0C18" stroke="#1E1E2E" stroke-width="2" stroke-dasharray="16,10" opacity="0.6"/>
  <text x="540" y="1180" font-family="'Inter', sans-serif" font-size="17" fill="#252538" text-anchor="middle">[ imagem de fundo — pessoa usando iPhone ]</text>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="1350" fill="#8B5CF6"/>

  <!-- Pilar Pill -->
  <rect x="80" y="98" width="148" height="28" rx="14" fill="#1C1028"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#8B5CF6" letter-spacing="1.5">IDENTIDADE</text>

  <!-- Accent Line -->
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#8B5CF6"/>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#F2F2F6">o celular</text>
  <text x="80" y="436" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#F2F2F6">que você usa</text>
  <text x="80" y="552" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#8B5CF6">fala sobre</text>
  <text x="80" y="668" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#8B5CF6">você.</text>

  <!-- Divider -->
  <line x1="80" y1="720" x2="500" y2="720" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub -->
  <text x="80" y="775" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="#C0C0D0">tem coisas que você só percebe</text>
  <text x="80" y="811" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="#C0C0D0">depois que troca.</text>

  <!-- CTA Button -->
  <rect x="80" y="896" width="368" height="60" rx="30" fill="#8B5CF6"/>
  <text x="264" y="934" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">chama no WhatsApp →</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
