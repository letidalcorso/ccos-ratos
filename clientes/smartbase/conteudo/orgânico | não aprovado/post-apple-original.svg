<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#F0EFEB"/>

  <!-- Handle top-left -->
  <text x="80" y="52" font-family="'Inter', sans-serif" font-size="18" fill="#888888">@smartbase.br</text>

  <!-- Arrow top-right -->
  <rect x="992" y="20" width="44" height="44" rx="10" fill="#E4E3DF"/>
  <text x="1014" y="50" font-family="'Inter', sans-serif" font-size="22" fill="#888888" text-anchor="middle">↗</text>

  <!-- Headline -->
  <text x="80" y="210" font-family="'Bricolage Grotesque', sans-serif" font-size="84" font-weight="700" fill="#5A5A5A">QUEM TEM,</text>
  <text x="80" y="310" font-family="'Bricolage Grotesque', sans-serif" font-size="84" font-weight="800" font-style="italic" fill="#3E82F7">NÃO VOLTA</text>
  <text x="80" y="410" font-family="'Bricolage Grotesque', sans-serif" font-size="84" font-weight="700" fill="#5A5A5A">ATRÁS.</text>

  <!-- Sub badge -->
  <rect x="80" y="442" width="560" height="38" rx="19" fill="none" stroke="#C8C7C3" stroke-width="1"/>
  <text x="360" y="467" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="1">PORQUE A EXPERIÊNCIA FALA MAIS ALTO.</text>

  <!-- Photo placeholder (full width, referência) -->
  <rect x="0" y="510" width="1080" height="640" fill="#E4E3DF"/>
  <text x="540" y="810" font-family="'Inter', sans-serif" font-size="22" fill="#888888" text-anchor="middle">[ foto: iPhones — ângulo traseiro ]</text>
  <text x="540" y="844" font-family="'Inter', sans-serif" font-size="16" fill="#AAAAAA" text-anchor="middle">1080 × 640px</text>

  <!-- Footer bar -->
  <rect x="0" y="1150" width="1080" height="200" fill="#E4E3DF"/>
  <line x1="0" y1="1150" x2="1080" y2="1150" stroke="#C8C7C3" stroke-width="1"/>
  <line x1="540" y1="1170" x2="540" y2="1330" stroke="#C8C7C3" stroke-width="1"/>

  <!-- Footer esquerda: Smartbase wordmark -->
  <text x="300" y="1248" font-family="'Bricolage Grotesque', sans-serif" font-size="34" text-anchor="middle" fill="#111111"><tspan font-weight="300">smart</tspan><tspan fill="#3E82F7">•</tspan><tspan font-weight="700">base</tspan></text>
  <text x="300" y="1286" font-family="'Inter', sans-serif" font-size="17" fill="#888888" text-anchor="middle">@smartbase.br</text>

  <!-- Footer direita: WhatsApp CTA -->
  <circle cx="598" cy="1242" r="22" fill="#25D366"/>
  <!-- Phone icon simples -->
  <text x="598" y="1251" font-family="'Inter', sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700">✓</text>
  <text x="636" y="1235" font-family="'Inter', sans-serif" font-size="21" font-weight="600" fill="#111111">CHAMA NO</text>
  <text x="636" y="1262" font-family="'Inter', sans-serif" font-size="21" font-weight="600" fill="#111111">WHATSAPP</text>
  <text x="636" y="1292" font-family="'Inter', sans-serif" font-size="15" fill="#888888">(54) 99662-4494</text>
</svg>
