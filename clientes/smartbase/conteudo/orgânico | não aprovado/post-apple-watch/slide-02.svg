<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Label + Counter -->
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">2/3</text>
  <rect x="80" y="148" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="280" font-family="'Bricolage Grotesque', sans-serif" font-size="72" font-weight="800" fill="#F2F2F6">depende do</text>
  <text x="80" y="364" font-family="'Bricolage Grotesque', sans-serif" font-size="72" font-weight="800" fill="#3E82F7">seu estilo.</text>

  <!-- Row 1 -->
  <rect x="80" y="430" width="920" height="86" rx="6" fill="#0E1E3A"/>
  <rect x="80" y="430" width="5" height="86" fill="#3E82F7"/>
  <text x="114" y="462" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7">treino, aventura e saúde a sério</text>
  <text x="114" y="496" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#7A7A96">Apple Watch Ultra 2 · bateria longa, GPS preciso, tela sempre ativa</text>

  <!-- Row 2 -->
  <rect x="80" y="534" width="920" height="86" rx="6" fill="#0F0F1C"/>
  <rect x="80" y="534" width="5" height="86" fill="#3E82F7"/>
  <text x="114" y="566" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7">uso diário completo</text>
  <text x="114" y="600" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#7A7A96">Apple Watch Series 10 · o mais leve, tela maior, chip mais rápido</text>

  <!-- Row 3 -->
  <rect x="80" y="638" width="920" height="86" rx="6" fill="#0F0F1C"/>
  <rect x="80" y="638" width="5" height="86" fill="#3E82F7"/>
  <text x="114" y="670" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#3E82F7">primeiro Apple Watch</text>
  <text x="114" y="704" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#7A7A96">Apple Watch SE · integração total com iPhone, menor preço</text>

  <!-- Body -->
  <text x="80" y="790" font-family="'Inter', sans-serif" font-size="26" font-weight="400" fill="#7A7A96">cada estilo de vida pede um modelo.</text>
  <text x="80" y="826" font-family="'Inter', sans-serif" font-size="26" font-weight="400" fill="#7A7A96">a gente sabe qual é o certo pra você.</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
