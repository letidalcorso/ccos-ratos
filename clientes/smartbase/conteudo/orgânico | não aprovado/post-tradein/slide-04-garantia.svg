<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="160" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="160" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">TRADE-IN</text>
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">4 / 5</text>

  <!-- Photo placeholder -->
  <rect x="80" y="136" width="920" height="480" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="136" width="920" height="480" rx="12" fill="none" stroke="#2A2A40" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="540" y="360" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="middle">[ foto: iPhone box lacrado ]</text>
  <text x="540" y="392" font-family="'Inter', sans-serif" font-size="15" fill="#2A2A40" text-anchor="middle">920 × 480px</text>

  <!-- Headline -->
  <text x="80" y="730" font-family="'Bricolage Grotesque', sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">lacrado, original,</text>
  <text x="80" y="828" font-family="'Bricolage Grotesque', sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">garantia Apple.</text>

  <line x1="80" y1="872" x2="1000" y2="872" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Highlight box -->
  <rect x="80" y="900" width="920" height="150" rx="6" fill="#0F0F1C"/>
  <rect x="80" y="900" width="5" height="150" rx="3" fill="#3E82F7"/>
  <text x="117" y="962" font-family="'Inter', sans-serif" font-size="28" fill="#C0C0D0">Você paga só o que falta.</text>
  <text x="117" y="1006" font-family="'Inter', sans-serif" font-size="28" fill="#C0C0D0">A entrega a gente acerta.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
