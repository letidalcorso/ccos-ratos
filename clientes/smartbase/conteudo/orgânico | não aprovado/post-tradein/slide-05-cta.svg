<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Ghost numeral -->
  <text x="-30" y="960" font-family="'Bricolage Grotesque', sans-serif" font-size="700" font-weight="900" fill="#F2F2F6" opacity="0.025">5</text>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="160" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="160" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">TRADE-IN</text>
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">5 / 5</text>

  <!-- Headline -->
  <text x="80" y="350" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#F2F2F6">chama no WhatsApp</text>
  <text x="80" y="444" font-family="'Bricolage Grotesque', sans-serif" font-size="80" font-weight="800" fill="#3E82F7">e resolve hoje.</text>

  <line x1="80" y1="492" x2="1000" y2="492" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Sub-headline -->
  <text x="80" y="546" font-family="'Inter', sans-serif" font-size="28" font-weight="300" fill="#C0C0D0">Me conta o modelo, a capacidade</text>
  <text x="80" y="590" font-family="'Inter', sans-serif" font-size="28" font-weight="300" fill="#C0C0D0">e o estado do seu aparelho.</text>

  <!-- Info box -->
  <rect x="80" y="636" width="920" height="284" rx="8" fill="#0F0F1C"/>
  <rect x="80" y="636" width="5" height="284" rx="3" fill="#3E82F7"/>

  <text x="117" y="688" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="#F2F2F6">modelo + capacidade</text>
  <text x="117" y="720" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60">ex: iPhone 14, 128GB</text>
  <line x1="117" y1="742" x2="980" y2="742" stroke="#1E1E2E" stroke-width="1"/>

  <text x="117" y="776" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="#F2F2F6">saúde da bateria</text>
  <text x="117" y="808" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60">ex: 87%</text>
  <line x1="117" y1="830" x2="980" y2="830" stroke="#1E1E2E" stroke-width="1"/>

  <text x="117" y="864" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="#F2F2F6">estado físico</text>
  <text x="117" y="896" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60">bom / com detalhes</text>

  <!-- CTA button -->
  <rect x="80" y="960" width="920" height="80" rx="40" fill="#3E82F7"/>
  <text x="540" y="1010" font-family="'Bricolage Grotesque', sans-serif" font-size="34" font-weight="800" fill="#F2F2F6" text-anchor="middle">Chama no WhatsApp →</text>

  <text x="540" y="1110" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="middle">sem compromisso. sem visita.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
