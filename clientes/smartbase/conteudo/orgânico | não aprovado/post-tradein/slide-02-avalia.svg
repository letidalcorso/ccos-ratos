<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Ghost numeral -->
  <text x="780" y="1200" font-family="'Bricolage Grotesque', sans-serif" font-size="500" font-weight="900" fill="#F2F2F6" opacity="0.025" text-anchor="end">2</text>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="160" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="160" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">TRADE-IN</text>
  <text x="1000" y="97" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="end">2 / 5</text>

  <!-- Photo placeholder -->
  <rect x="80" y="136" width="920" height="560" rx="12" fill="#0F0F1C"/>
  <rect x="80" y="136" width="920" height="560" rx="12" fill="none" stroke="#2A2A40" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="540" y="400" font-family="'Inter', sans-serif" font-size="20" fill="#4A4A60" text-anchor="middle">[ foto: iPhone antigo na mão ]</text>
  <text x="540" y="432" font-family="'Inter', sans-serif" font-size="15" fill="#2A2A40" text-anchor="middle">920 × 560px</text>

  <!-- Headline -->
  <text x="80" y="850" font-family="'Bricolage Grotesque', sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">a gente avalia</text>
  <text x="80" y="948" font-family="'Bricolage Grotesque', sans-serif" font-size="88" font-weight="800" fill="#F2F2F6">o que você tem...</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
