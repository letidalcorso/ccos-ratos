<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- PLACEHOLDER DE IMAGEM — pode ser fundo, recorte ou produto -->
  <rect x="0" y="0" width="1080" height="1350" fill="#0C0C18" stroke="#1E1E2E" stroke-width="2" stroke-dasharray="16,10" opacity="0.6"/>
  <text x="540" y="1180" font-family="'Inter', sans-serif" font-size="17" fill="#252538" text-anchor="middle">[ imagem de fundo — iPhone seminovo ]</text>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Pilar Pill -->
  <rect x="80" y="98" width="112" height="28" rx="14" fill="#0E1E3A"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>

  <!-- Accent Line -->
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#F2F2F6">iPhone</text>
  <text x="80" y="436" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="800" fill="#F2F2F6">sem susto.</text>

  <!-- Sub -->
  <text x="80" y="530" font-family="'Inter', sans-serif" font-size="32" font-weight="500" fill="#C0C0D0">avaliado. testado.</text>

  <!-- Divider line -->
  <line x1="80" y1="590" x2="600" y2="590" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Selos -->
  <rect x="80" y="622" width="202" height="34" rx="17" fill="#0A201A"/>
  <text x="103" y="645" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  Verificado</text>

  <rect x="300" y="622" width="228" height="34" rx="17" fill="#0A201A"/>
  <text x="323" y="645" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  Com garantia</text>

  <!-- Tagline -->
  <text x="80" y="740" font-family="'Bricolage Grotesque', sans-serif" font-size="38" font-weight="700" fill="#3E82F7">Mesma Apple. Outro preço.</text>

  <!-- Body -->
  <text x="80" y="816" font-family="'Inter', sans-serif" font-size="26" font-weight="400" fill="#7A7A96">preço que faz sentido. Apple do jeito certo.</text>

  <!-- CTA text -->
  <text x="80" y="910" font-family="'Inter', sans-serif" font-size="26" font-weight="600" fill="#3E82F7">chama pra ver o que tem disponível →</text>

  <!-- Footer Divider -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
