<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#000000"/>

  <!-- Header -->
  <line x1="80" y1="120" x2="130" y2="120" stroke="#2DFF8B" stroke-width="4"/>
  <text x="145" y="128" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="3">AUTORIDADE</text>
  <text x="1000" y="128" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" opacity="0.6">3/8</text>

  <!-- Title -->
  <text x="80" y="320" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0">de cada R$ 12.499</tspan>
    <tspan x="80" dy="74">cobrados...</tspan>
  </text>

  <!-- Stacked bar visualization -->
  <rect x="80" y="550" width="920" height="100" fill="#FFFFFF" opacity="0.15"/>
  <rect x="80" y="550" width="294" height="100" fill="#FFFFFF" opacity="0.85"/>
  <rect x="374" y="550" width="626" height="100" fill="#2DFF8B"/>

  <!-- Labels -->
  <text x="227" y="610" fill="#000000" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">32%</text>
  <text x="687" y="610" fill="#000000" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">68%</text>

  <!-- Legend -->
  <g transform="translate(80, 760)">
    <rect x="0" y="0" width="30" height="30" fill="#FFFFFF" opacity="0.85"/>
    <text x="50" y="22" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="500">R$ 3.880 = aparelho + margem Apple</text>
  </g>
  <g transform="translate(80, 820)">
    <rect x="0" y="0" width="30" height="30" fill="#2DFF8B"/>
    <text x="50" y="22" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="500">R$ 8.619 = </text><text x="232" y="22" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="700">imposto brasileiro</text>
  </g>

  <!-- Highlight statement -->
  <text x="80" y="980" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
    <tspan x="80" dy="0">você paga </tspan><tspan dy="0" fill="#2DFF8B">2 iPhones</tspan>
    <tspan x="80" dy="56">e leva </tspan><tspan dy="0">1.</tspan>
  </text>

  <!-- Footnote -->
  <text x="80" y="1190" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" opacity="0.4">fonte: IBPT — carga tributária smartphone importado 68,76%</text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="-1">smart<tspan font-weight="300">base</tspan></text>
  <text x="1000" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" opacity="0.5">@smartbase.br</text>
</svg>
