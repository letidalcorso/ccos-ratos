<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600&amp;display=swap');</style>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070E" stop-opacity="1"/>
      <stop offset="60%" stop-color="#07070E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07070E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Photo placeholder: ocupa a metade inferior -->
  <rect x="0" y="480" width="1080" height="720" fill="#0F0F1C"/>
  <rect x="0" y="480" width="1080" height="720" fill="none" stroke="#1E1E2E" stroke-dasharray="10,5" stroke-width="1.5"/>
  <text x="540" y="840" font-family="'Inter', sans-serif" font-size="22" fill="#3A3A50" text-anchor="middle">[ foto: iPhone 17 Pro azul — pessoa segurando o aparelho ]</text>
  <text x="540" y="874" font-family="'Inter', sans-serif" font-size="15" fill="#2A2A3A" text-anchor="middle">1080 × 720px</text>

  <!-- Gradiente sobre a foto pra transição suave com o texto -->
  <rect x="0" y="480" width="1080" height="300" fill="url(#fadeDown)"/>

  <!-- Left stripe -->
  <rect x="0" y="0" width="4" height="1350" fill="#3E82F7"/>

  <!-- Pilar pill -->
  <rect x="80" y="72" width="140" height="40" rx="20" fill="#0F0F1C" stroke="#3E82F7" stroke-width="1"/>
  <text x="150" y="97" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#3E82F7" text-anchor="middle" letter-spacing="2">PRODUTO</text>

  <!-- Headline -->
  <text x="80" y="220" font-family="'Bricolage Grotesque', sans-serif" font-size="100" font-weight="800" fill="#F2F2F6">o iPhone</text>
  <text x="80" y="330" font-family="'Bricolage Grotesque', sans-serif" font-size="100" font-weight="800" fill="#F2F2F6">que você</text>
  <text x="80" y="440" font-family="'Bricolage Grotesque', sans-serif" font-size="100" font-weight="800" fill="#3E82F7">queria.</text>

  <!-- Sub -->
  <text x="80" y="508" font-family="'Inter', sans-serif" font-size="26" font-weight="300" fill="#7A7A96">17 Pro. Azul. Lacrado.</text>

  <!-- CTA area (sobre a foto, parte inferior) -->
  <rect x="80" y="1120" width="920" height="76" rx="38" fill="#3E82F7"/>
  <text x="540" y="1168" font-family="'Bricolage Grotesque', sans-serif" font-size="34" font-weight="800" fill="#F2F2F6" text-anchor="middle">Chama no WhatsApp →</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <rect x="80" y="1276" width="96" height="30" rx="15" fill="#0F0F1C"/>
  <text x="128" y="1297" font-family="'Inter', sans-serif" font-size="13" fill="#3E82F7" text-anchor="middle" font-weight="600">sb</text>
  <text x="194" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="28" fill="#F2F2F6"><tspan font-weight="300">smart</tspan><tspan font-weight="700">base</tspan></text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="22" fill="#4A4A60" text-anchor="end">@smartbase.br</text>
</svg>
