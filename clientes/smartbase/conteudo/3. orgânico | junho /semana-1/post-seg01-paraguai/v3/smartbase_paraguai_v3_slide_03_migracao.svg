<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Decorative "+230" massive cut-off right -->
  <text x="1280" y="900" fill="#3E82F7" font-family="'Bricolage Grotesque', sans-serif" font-size="540" font-weight="800" text-anchor="end" opacity="0.10">+230</text>

  <text x="80" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" letter-spacing="3">DECIFRA APPLE</text>
  <text x="1000" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" text-anchor="end">3/6</text>

  <!-- Top label -->
  <text x="80" y="320" fill="#3E82F7" font-family="'Inter', sans-serif" font-size="22" font-weight="600" letter-spacing="3">E NÃO FOI À TOA</text>

  <!-- Main statement -->
  <text x="80" y="440" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="68" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0">mais de </tspan><tspan dy="0" fill="#3E82F7">230 empresas</tspan>
    <tspan x="80" dy="80">brasileiras já</tspan>
    <tspan x="80" dy="80">migraram pra lá.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="820" fill="#C0C0D0" font-family="'Inter', sans-serif" font-size="28" font-weight="400">
    <tspan x="80" dy="0">o regime fiscal paraguaio, chamado "triplo 10",</tspan>
    <tspan x="80" dy="42">cobra 10% sobre consumo, 10% sobre empresa e</tspan>
    <tspan x="80" dy="42">10% sobre pessoa. e reduz custos em até 40%.</tspan>
  </text>

  <!-- Divider -->
  <line x1="80" y1="1080" x2="200" y2="1080" stroke="#3E82F7" stroke-width="2"/>

  <!-- Final statement -->
  <text x="80" y="1170" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="30" font-weight="500">
    <tspan x="80" dy="0">a economia paraguaia hoje é </tspan><tspan dy="0" fill="#3E82F7" font-weight="700">a que mais</tspan>
    <tspan x="80" dy="40">cresce em toda a América do Sul.</tspan>
  </text>

  <text x="80" y="1280" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="700" letter-spacing="-1">smartbase</text>
  <text x="1000" y="1280" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="400" text-anchor="end">@smartbase.br</text>
</svg>
