<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#000000"/>

  <!-- Header -->
  <line x1="80" y1="120" x2="130" y2="120" stroke="#2DFF8B" stroke-width="4"/>
  <text x="145" y="128" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="3">AUTORIDADE</text>
  <text x="1000" y="128" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" opacity="0.6">5/7</text>

  <!-- Title -->
  <text x="80" y="420" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="100" font-weight="700" letter-spacing="-3">
    <tspan x="80" dy="0">a Apple opera</tspan>
    <tspan x="80" dy="115" fill="#2DFF8B">oficialmente lá.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="720" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="400" opacity="0.9">
    <tspan x="80" dy="0">Casa Nissei — Apple Authorized Reseller há 43 anos.</tspan>
    <tspan x="80" dy="50">mesmo IMEI no sistema da Apple global.</tspan>
    <tspan x="80" dy="50">mesma garantia internacional de 1 ano.</tspan>
  </text>

  <!-- Verde CTA box -->
  <rect x="80" y="950" width="920" height="130" rx="8" fill="none" stroke="#2DFF8B" stroke-width="2"/>
  <text x="110" y="1000" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="600">checkcoverage.apple.com</text>
  <text x="110" y="1045" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" opacity="0.7">você mesmo confere antes de pagar.</text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="-1">smart<tspan font-weight="300">base</tspan></text>
  <text x="1000" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" opacity="0.5">@smartbase.br</text>
</svg>
