<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#000000"/>

  <!-- Big decorative cut-off "★★" bottom-right -->
  <text x="1180" y="1260" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="620" font-weight="700" text-anchor="end" opacity="0.10">★★</text>

  <!-- Header -->
  <line x1="80" y1="120" x2="130" y2="120" stroke="#2DFF8B" stroke-width="4"/>
  <text x="145" y="128" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="3">AUTORIDADE</text>
  <text x="1000" y="128" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" opacity="0.6">2/7</text>

  <!-- Title -->
  <text x="80" y="370" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="100" font-weight="700" letter-spacing="-3">
    <tspan x="80" dy="0">investment</tspan>
    <tspan x="80" dy="115">grade.</tspan>
    <tspan x="80" dy="115" fill="#2DFF8B">duas vezes.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="820" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="400" opacity="0.85">
    <tspan x="80" dy="0">Moody's (2024) e S&amp;P (2025) classificaram</tspan>
    <tspan x="80" dy="46">o Paraguai como grau de investimento.</tspan>
  </text>

  <!-- Twist line -->
  <text x="80" y="980" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="500">
    <tspan x="80" dy="0">o Brasil perdeu esse status em 2015.</tspan>
    <tspan x="80" dy="42">até hoje não recuperou.</tspan>
  </text>

  <!-- Footnote -->
  <text x="80" y="1190" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" opacity="0.4">fonte: Moody's Investors Service, S&amp;P Global Ratings, 2024–2025</text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="-1">smart<tspan font-weight="300">base</tspan></text>
  <text x="1000" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" opacity="0.5">@smartbase.br</text>
</svg>
