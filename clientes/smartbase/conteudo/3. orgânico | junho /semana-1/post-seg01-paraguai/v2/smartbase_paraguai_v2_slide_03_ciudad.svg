<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Decorative "10%" massive cut-off right side -->
  <text x="1480" y="900" fill="#3E82F7" font-family="'Bricolage Grotesque', sans-serif" font-size="640" font-weight="800" text-anchor="end" opacity="0.10">10%</text>

  <!-- Tag top -->
  <text x="80" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" letter-spacing="3">DECIFRA APPLE</text>
  <text x="1000" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" text-anchor="end">3/6</text>

  <!-- City name big -->
  <text x="80" y="380" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="96" font-weight="700" letter-spacing="-3">
    <tspan x="80" dy="0">Ciudad</tspan>
    <tspan x="80" dy="112">del Este</tspan>
  </text>

  <!-- Description -->
  <text x="80" y="720" fill="#C0C0D0" font-family="'Inter', sans-serif" font-size="32" font-weight="400">uma cidade que vive de comércio.</text>

  <!-- Big statement -->
  <text x="80" y="900" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0"><tspan fill="#3E82F7">10%</tspan> de toda a economia</tspan>
    <tspan x="80" dy="76">paraguaia sai dali.</tspan>
  </text>

  <!-- Divider -->
  <line x1="80" y1="1100" x2="200" y2="1100" stroke="#3E82F7" stroke-width="2"/>

  <!-- Reveal -->
  <text x="80" y="1180" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="32" font-weight="500">
    <tspan x="80" dy="0">e o produto que mais movimenta?</tspan>
    <tspan x="80" dy="44" fill="#3E82F7" font-weight="700">eletrônico Apple.</tspan>
  </text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="700" letter-spacing="-1">smartbase</text>
  <text x="1000" y="1280" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="400" text-anchor="end">@smartbase.br</text>
</svg>
