<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Tag top -->
  <text x="80" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" letter-spacing="3">DECIFRA APPLE</text>
  <text x="1000" y="128" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" text-anchor="end">4/6</text>

  <!-- Title top -->
  <text x="80" y="280" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan x="80" dy="0">a Apple opera lá</tspan>
    <tspan x="80" dy="76" fill="#3E82F7">oficialmente.</tspan>
  </text>

  <!-- Mockup checkcoverage card -->
  <rect x="80" y="540" width="920" height="380" rx="20" fill="#F2F2F6"/>

  <text x="540" y="610" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="500" text-anchor="middle" letter-spacing="1">checkcoverage.apple.com</text>

  <text x="540" y="700" fill="#07070E" font-family="'Bricolage Grotesque', sans-serif" font-size="40" font-weight="700" text-anchor="middle">iPhone 17 Pro Max</text>
  <text x="540" y="740" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="400" text-anchor="middle">IMEI · 35XXXXXXXXXXXX</text>

  <rect x="280" y="800" width="520" height="80" rx="12" fill="#07070E"/>
  <circle cx="335" cy="840" r="10" fill="#3E82F7"/>
  <text x="365" y="848" fill="#3E82F7" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="700">Apple Limited Warranty: ACTIVE</text>

  <!-- Caption below -->
  <text x="80" y="1000" fill="#C0C0D0" font-family="'Inter', sans-serif" font-size="28" font-weight="400">
    <tspan x="80" dy="0">a Casa Nissei é revendedor Apple há 43 anos.</tspan>
    <tspan x="80" dy="42">cada iPhone tem IMEI no sistema global.</tspan>
  </text>

  <!-- CTA inline -->
  <text x="80" y="1180" fill="#3E82F7" font-family="'Bricolage Grotesque', sans-serif" font-size="28" font-weight="600">confere você mesmo, antes de comprar.</text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#F2F2F6" font-family="'Bricolage Grotesque', sans-serif" font-size="36" font-weight="700" letter-spacing="-1">smartbase</text>
  <text x="1000" y="1280" fill="#7A7A96" font-family="'Inter', sans-serif" font-size="22" font-weight="400" text-anchor="end">@smartbase.br</text>
</svg>
