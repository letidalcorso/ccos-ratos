  <line x1="80" y1="180" x2="130" y2="180" stroke="#2DFF8B" stroke-width="4"/>
  <text x="145" y="188" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3">ESSA SEMANA</text>

  <!-- Main title -->
  <text x="80" y="900" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="120" font-weight="700" letter-spacing="-3">
