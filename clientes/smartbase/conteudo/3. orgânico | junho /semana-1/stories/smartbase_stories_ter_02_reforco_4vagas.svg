  <text x="540" y="1635" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" opacity="0.5">+ link sticker pro post no feed</text>

