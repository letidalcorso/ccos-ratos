<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#000000"/>

  <!-- Big decorative "60%" -->
  <text x="1280" y="1340" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="540" font-weight="800" text-anchor="end" opacity="0.10">60%</text>

  <!-- Header -->
  <line x1="80" y1="120" x2="130" y2="120" stroke="#2DFF8B" stroke-width="4"/>
  <text x="145" y="128" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="3">AUTORIDADE</text>
  <text x="1000" y="128" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="end" opacity="0.6">3/7</text>

  <!-- Mini label -->
  <text x="80" y="370" fill="#2DFF8B" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="3">APRENDIZADO 02</text>

  <!-- Title -->
  <text x="80" y="500" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-3">
    <tspan x="80" dy="0">60% dos clientes</tspan>
    <tspan x="80" dy="108">são</tspan>
    <tspan x="80" dy="108" fill="#2DFF8B">brasileiros.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="950" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="400" opacity="0.85">
    <tspan x="80" dy="0">o polo inteiro existe por causa do brasileiro.</tspan>
    <tspan x="80" dy="46">a infraestrutura, o atendimento, o português.</tspan>
    <tspan x="80" dy="46">tudo organizado pra quem vem buscar.</tspan>
  </text>

  <!-- Footer -->
  <text x="80" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="-1">smart<tspan font-weight="300">base</tspan></text>
  <text x="1000" y="1280" fill="#FFFFFF" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="end" opacity="0.5">@smartbase.br</text>
</svg>
