<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Pilar pill -->
  <rect x="80" y="98" width="152" height="28" rx="14" fill="#0A201A"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#10B981" letter-spacing="1.5">AUTORIDADE</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">5/7</text>
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#10B981"/>

  <!-- Headline — statement -->
  <text x="80" y="330" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">a diferença de</text>
  <text x="80" y="412" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">preço existe porque</text>
  <text x="80" y="494" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">o sistema tributário</text>
  <text x="80" y="576" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">brasileiro é outro.</text>

  <!-- Divider -->
  <line x1="80" y1="624" x2="500" y2="624" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Conclusão -->
  <text x="80" y="686" font-family="'Inter', sans-serif" font-size="34" font-weight="500" fill="#10B981">o produto é o mesmo.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
