<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Pilar pill -->
  <rect x="80" y="98" width="152" height="28" rx="14" fill="#0A201A"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#10B981" letter-spacing="1.5">AUTORIDADE</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">4/7</text>
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#10B981"/>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#F2F2F6">garantia Apple</text>
  <text x="80" y="400" font-family="'Bricolage Grotesque', sans-serif" font-size="64" font-weight="800" fill="#10B981">internacional.</text>

  <!-- Sub -->
  <text x="80" y="476" font-family="'Inter', sans-serif" font-size="34" font-weight="500" fill="#C0C0D0">válida aqui. verificável pelo IMEI.</text>

  <!-- Divider -->
  <line x1="80" y1="524" x2="500" y2="524" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Selos -->
  <rect x="80" y="560" width="240" height="36" rx="18" fill="#0A201A"/>
  <text x="100" y="583" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  1 ano de garantia</text>

  <rect x="80" y="614" width="260" height="36" rx="18" fill="#0A201A"/>
  <text x="100" y="637" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#10B981">✓  verificado pelo IMEI</text>

  <!-- Highlight box — verificação -->
  <rect x="80" y="690" width="840" height="100" rx="6" fill="#0A201A"/>
  <rect x="80" y="690" width="5" height="100" rx="2" fill="#10B981"/>
  <text x="122" y="734" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#C0C0D0">checkcoverage.apple.com</text>
  <text x="122" y="770" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#7A7A96">você mesmo confere antes de comprar.</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
