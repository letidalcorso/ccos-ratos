<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,700;12..96,800&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');</style>
  </defs>

  <rect width="1080" height="1350" fill="#07070E"/>

  <!-- Pilar pill: PRODUTO -->
  <rect x="80" y="98" width="118" height="28" rx="14" fill="#0E1E3A"/>
  <text x="94" y="117" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#3E82F7" letter-spacing="1.5">PRODUTO</text>
  <text x="1000" y="120" font-family="'Inter', sans-serif" font-size="22" font-weight="500" fill="#7A7A96" text-anchor="end">5/6</text>
  <rect x="80" y="188" width="100" height="7" rx="3.5" fill="#3E82F7"/>

  <!-- Model name (font menor — nome longo) -->
  <text x="80" y="300" font-family="'Bricolage Grotesque', sans-serif" font-size="68" font-weight="800" fill="#F2F2F6">iPhone 17</text>
  <text x="80" y="378" font-family="'Bricolage Grotesque', sans-serif" font-size="68" font-weight="800" fill="#3E82F7">Pro Max</text>

  <!-- Descriptor -->
  <text x="80" y="454" font-family="'Inter', sans-serif" font-size="32" font-weight="500" fill="#C0C0D0">tela maior. bateria máxima.</text>
  <text x="80" y="494" font-family="'Inter', sans-serif" font-size="32" font-weight="500" fill="#C0C0D0">o top de linha.</text>

  <!-- Divider -->
  <line x1="80" y1="540" x2="400" y2="540" stroke="#1E1E2E" stroke-width="1"/>

  <!-- Photo placeholder -->
  <rect x="80" y="574" width="920" height="460" rx="12" fill="#0F0F1C" stroke="#1E1E2E" stroke-width="1" stroke-dasharray="8,6"/>
  <text x="540" y="799" font-family="'Inter', sans-serif" font-size="18" fill="#2A2A40" text-anchor="middle">[ render: iphone17pro-hero.jpg ]</text>
  <text x="540" y="829" font-family="'Inter', sans-serif" font-size="16" fill="#1E1E2E" text-anchor="middle">dark-linha-17/renders/</text>

  <!-- Footer -->
  <line x1="80" y1="1258" x2="1000" y2="1258" stroke="#1E1E2E" stroke-width="1"/>
  <text x="80" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="300" fill="#C0C0D0">smart</text>
  <circle cx="145" cy="1291" r="5" fill="#3E82F7"/>
  <text x="155" y="1297" font-family="'Bricolage Grotesque', sans-serif" font-size="26" font-weight="700" fill="#F2F2F6">base</text>
  <text x="1000" y="1297" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#7A7A96" text-anchor="end">@smartbase.br</text>
</svg>
