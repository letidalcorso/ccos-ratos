<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Smartbase — Sacola Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #E8E4DC;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 580px;
    height: 520px;
  }

  /* ── SACOLA ── */
  .bag {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 400px;
  }

  /* Frente da sacola */
  .bag-front {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 370px;
    background: #07070E;
    border-radius: 3px 3px 4px 4px;
    box-shadow:
      -18px 0 40px rgba(0,0,0,0.35),
       18px 0 40px rgba(0,0,0,0.2),
       0 24px 60px rgba(0,0,0,0.4);
    overflow: hidden;
    z-index: 2;
  }

  /* Dobra do topo da frente */
  .bag-front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: linear-gradient(to bottom, #252535, #07070E);
  }

  /* Sombra lateral interna esquerda (gusset) */
  .bag-front::after {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 32px;
    background: linear-gradient(to right, rgba(0,0,0,0.5), transparent);
    pointer-events: none;
  }

  /* Sombra lateral interna direita */
  .bag-shadow-right {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 32px;
    background: linear-gradient(to left, rgba(0,0,0,0.3), transparent);
    pointer-events: none;
    z-index: 10;
    border-radius: 0 3px 4px 0;
  }

  /* Lateral esquerda da sacola (espessura) */
  .bag-side-left {
    position: absolute;
    bottom: 0;
    left: calc(50% - 210px - 14px);
    width: 14px;
    height: 370px;
    background: linear-gradient(to right, #030309, #0d0d18);
    border-radius: 3px 0 0 4px;
    z-index: 1;
    box-shadow: -6px 0 20px rgba(0,0,0,0.4);
  }

  /* Lateral direita */
  .bag-side-right {
    position: absolute;
    bottom: 0;
    left: calc(50% + 210px);
    width: 14px;
    height: 370px;
    background: linear-gradient(to right, #0d0d18, #030309);
    border-radius: 0 3px 4px 0;
    z-index: 1;
  }

  /* ── ALÇAS ── */
  .handles {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 100px;
    z-index: 5;
  }

  .handle {
    position: absolute;
    top: 0;
    width: 80px;
    height: 90px;
    border: 8px solid #1C1C2A;
    border-bottom: none;
    border-radius: 40px 40px 0 0;
  }

  .handle-left  { left: 95px; }
  .handle-right { right: 95px; }

  /* ── CONTEÚDO IMPRESSO ── */
  .bag-content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 50px 30px;
    z-index: 3;
  }

  /* Elemento decorativo — círculos */
  .circles {
    position: absolute;
    top: 50%;
    right: -60px;
    transform: translateY(-50%);
    width: 280px;
    height: 280px;
    opacity: 0.1;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 14px;
    line-height: 1;
  }

  .w-smart {
    font-size: 52px;
    font-weight: 300;
    color: #7A7A96;
    letter-spacing: -1px;
  }

  .w-dot {
    width: 9px;
    height: 9px;
    background: #3E82F7;
    border-radius: 50%;
    margin: 0 1px;
    margin-bottom: 4px;
    flex-shrink: 0;
  }

  .w-base {
    font-size: 52px;
    font-weight: 700;
    color: #F2F2F6;
    letter-spacing: -1px;
  }

  .divider {
    width: 160px;
    height: 1px;
    background: #1E1E2E;
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 14px;
    font-weight: 300;
    color: #7A7A96;
    letter-spacing: 0.3px;
    text-align: center;
  }

  .handle-instagram {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 300;
    color: #3E3E5C;
    letter-spacing: 1.5px;
    white-space: nowrap;
    z-index: 4;
  }

  /* Label de referência */
  .label {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #9A9080;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="scene">

  <!-- Alças -->
  <div class="handles">
    <div class="handle handle-left"></div>
    <div class="handle handle-right"></div>
  </div>

  <div class="bag">
    <!-- Laterais -->
    <div class="bag-side-left"></div>
    <div class="bag-side-right"></div>

    <!-- Frente -->
    <div class="bag-front">
      <div class="bag-shadow-right"></div>

      <!-- Círculos decorativos -->
      <svg class="circles" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="180" cy="140" r="130" stroke="#3E82F7" stroke-width="1.5"/>
        <circle cx="180" cy="140" r="85"  stroke="#3E82F7" stroke-width="1"/>
      </svg>

      <!-- Conteúdo -->
      <div class="bag-content">
        <div class="wordmark">
          <span class="w-smart">smart</span>
          <span class="w-dot"></span>
          <span class="w-base">base</span>
        </div>
        <div class="divider"></div>
        <div class="tagline">sua apple store. particular.</div>
      </div>

      <div class="handle-instagram">@smartbase.br</div>
    </div>
  </div>

  <div class="label">Frente · Conceito · 264×231mm</div>
</div>

</body>
</html>
