<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2312 1200" width="2312" height="1200">
  <!--
    GABARITO INTERNO — Sacola de Papel Teepee M
    Printi · L264 × A231 × P10mm
    Escala: 4px = 1mm

    Layout (esquerda → direita):
    [INTERIOR TOPO 264mm] [INTERIOR FUNDO 264mm]

    Interior Topo   → painel interno oposto ao VERSO — visível ao abrir a sacola
    Interior Fundo  → painel interno oposto ao FRENTE — surpresa ao retirar o aparelho

    ATENÇÃO: Painéis internos são impressos no verso do papel.
    A gráfica faz o espelhamento horizontal automaticamente.
    Se enviar para impressão digital direta, espelhar horizontalmente antes.
  -->

  <!-- Pasteboard -->
  <rect width="2312" height="1200" fill="#1E1E1E"/>

  <!-- Marcas de registro -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="66" y1="76" x2="74" y2="76"/><line x1="70" y1="72" x2="70" y2="80"/>
    <line x1="2178" y1="76" x2="2186" y2="76"/><line x1="2182" y1="72" x2="2182" y2="80"/>
    <line x1="66" y1="1084" x2="74" y2="1084"/><line x1="70" y1="1080" x2="70" y2="1088"/>
    <line x1="2178" y1="1084" x2="2186" y2="1084"/><line x1="2182" y1="1080" x2="2182" y2="1088"/>
  </g>

  <!-- ────────────────────────── -->
  <!-- CABEÇALHO -->
  <!-- ────────────────────────── -->
  <text x="70" y="46"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="16" font-weight="700" fill="#888" letter-spacing="2">
    SMARTBASE · SACOLA TEEPEE M · INTERNO · L264×A231×P10mm
  </text>
  <text x="2242" y="46"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="300" fill="#555" letter-spacing="1"
    text-anchor="end">
    4px = 1mm · Printi
  </text>
  <line x1="70" y1="58" x2="2242" y2="58" stroke="#333" stroke-width="0.5"/>

  <!-- ────────────────────────── -->
  <!-- FACE 05: INTERIOR TOPO -->
  <!-- x=70, y=80 | 1056×924 -->
  <!-- Interior oposto ao VERSO — visível ao abrir -->
  <!-- ────────────────────────── -->
  <svg x="70" y="80" width="1056" height="924" viewBox="0 0 1056 924">
    <rect width="1056" height="924" fill="#3E82F7"/>
    <rect width="1056" height="924" fill="white" opacity="0.03"/>
    <!-- @smartbase.br — esquerda, topo -->
    <text x="80" y="134"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="28" font-weight="400" letter-spacing="-0.3"
      fill="white">@smartbase.br</text>
    <!-- Divisor vertical central -->
    <line x1="528" y1="96" x2="528" y2="168" stroke="white" stroke-width="1" opacity="0.30"/>
    <!-- (54) 9 9662.4494 — direita, topo -->
    <text x="976" y="134" text-anchor="end"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="28" font-weight="400" letter-spacing="-0.3"
      fill="white">(54) 9 9662.4494</text>
  </svg>

  <!-- Vinco central (divisória entre os dois painéis internos) -->
  <line x1="1126" y1="72" x2="1126" y2="1012" stroke="#00FFFF" stroke-width="0.6" stroke-dasharray="6,3"/>

  <!-- ────────────────────────── -->
  <!-- FACE 06: INTERIOR FUNDO -->
  <!-- x=1126, y=80 | 1056×924 -->
  <!-- Interior oposto ao FRENTE — surpresa -->
  <!-- ────────────────────────── -->
  <svg x="1126" y="80" width="1056" height="924" viewBox="0 0 1056 924">
    <rect width="1056" height="924" fill="#3E82F7"/>
    <rect width="1056" height="924" fill="white" opacity="0.03"/>
    <!-- Frase -->
    <text x="528" y="388"
      text-anchor="middle"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="56" font-weight="700" letter-spacing="-0.8"
      fill="white">versão mais recente</text>
    <text x="528" y="460"
      text-anchor="middle"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="56" font-weight="700" letter-spacing="-0.8"
      fill="white">de você: instalada.</text>
    <!-- Linha separadora -->
    <line x1="428" y1="502" x2="628" y2="502" stroke="white" stroke-width="0.8" opacity="0.25"/>
    <!-- Wordmark — pill style, centralizado -->
    <rect x="445" y="520" width="166" height="42" rx="21"
      fill="none" stroke="white" stroke-width="1.5" opacity="0.35"/>
    <circle cx="467" cy="541" r="5" fill="white" opacity="0.5"/>
    <text x="481" y="548"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="26" font-weight="300" letter-spacing="-0.3"
      fill="white" opacity="0.5">smart</text>
    <text x="546" y="548"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="26" font-weight="700" letter-spacing="-0.3"
      fill="white" opacity="0.8">base</text>
  </svg>

  <!-- CORTE (contorno da área de impressão interna) -->
  <rect x="70" y="80" width="2112" height="924"
    fill="none" stroke="#FF3B30" stroke-width="0.8" stroke-dasharray="10,4"/>

  <!-- ────────────────────────── -->
  <!-- COTAS -->
  <!-- ────────────────────────── -->
  <text x="598" y="1040"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" fill="#888" text-anchor="middle">
    INTERIOR TOPO · 264×231mm
  </text>
  <text x="1654" y="1040"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" fill="#888" text-anchor="middle">
    INTERIOR FUNDO · 264×231mm
  </text>

  <line x1="70" y1="1022" x2="1126" y2="1022" stroke="#555" stroke-width="0.5"/>
  <line x1="1126" y1="1022" x2="2182" y2="1022" stroke="#555" stroke-width="0.5"/>
  <line x1="70" y1="1016" x2="70" y2="1028" stroke="#555" stroke-width="0.5"/>
  <line x1="1126" y1="1016" x2="1126" y2="1028" stroke="#555" stroke-width="0.5"/>
  <line x1="2182" y1="1016" x2="2182" y2="1028" stroke="#555" stroke-width="0.5"/>

  <!-- Cota altura -->
  <text x="36" y="542"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" fill="#888" text-anchor="middle"
    transform="rotate(-90, 36, 542)">231mm</text>

  <!-- ────────────────────────── -->
  <!-- NOTA DE IMPRESSÃO -->
  <!-- ────────────────────────── -->
  <text x="70" y="1090"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" font-weight="700" fill="#888">⚠  IMPRESSÃO INTERNA:</text>
  <text x="232" y="1090"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" fill="#666">
    Gráfica espelha horizontalmente para impressão no verso do papel.
  </text>
  <text x="70" y="1112"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13" fill="#666">
    Interior Topo (azul + contato) = painel oposto ao VERSO.
    Interior Fundo (azul + frase) = painel oposto ao FRENTE.
  </text>

  <!-- Legenda linhas -->
  <line x1="70" y1="1150" x2="90" y2="1150" stroke="#00FFFF" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="98" y="1154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#555">Vinco</text>
  <line x1="150" y1="1150" x2="170" y2="1150" stroke="#FF3B30" stroke-width="1" stroke-dasharray="10,4"/>
  <text x="178" y="1154" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#555">Corte</text>

  <text x="2242" y="1185"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11" fill="#444" text-anchor="end">
    Remover barras de nota de produção antes de enviar para gráfica
  </text>
</svg>
