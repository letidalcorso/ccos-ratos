<?xml version="1.0" encoding="UTF-8"?>
<!--
  Caneca Smartbase — A evolução das câmeras
  Artwork para impressão: 200mm × 90mm (área de wrap caneca 11oz)
  Fundo: Off-white #F5F0E8 | Traço: #1A1A1A
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 90"
     width="200mm" height="90mm">

  <!-- ── Background ── -->
  <rect width="200" height="90" fill="#F5F0E8"/>

  <!-- ════════════════════════════════════════
       LINEUP DE IPHONES — vista traseira
       Baseline y=63 | Scale 0.37x dos originals
       Total lineup width ≈ 140mm, centrado em 200mm
  ════════════════════════════════════════ -->

  <!-- 2007 — flush único, top-center -->
  <svg x="30.10" y="37.84" width="12.58" height="25.16" viewBox="0 0 34 68" fill="none">
    <rect x="1" y="1" width="32" height="66" rx="6.5" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="17" cy="9"  r="3.5" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="17" cy="9"  r="1.7" stroke="#1A1A1A" stroke-width="0.9"/>
    <rect x="12" y="56" width="10" height="1.8" rx="0.9" stroke="#1A1A1A" stroke-width="0.9"/>
  </svg>

  <!-- 2013 — 5s: sapphire ring + flash + antena -->
  <svg x="47.18" y="36.36" width="13.32" height="26.64" viewBox="0 0 36 72" fill="none">
    <rect x="1" y="1" width="34" height="70" rx="7" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="10" cy="10" r="4.5" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="2.7" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="10" cy="10" r="1.2" stroke="#1A1A1A" stroke-width="0.7"/>
    <rect x="17.5" y="7.5" width="3.5" height="4.5" rx="1.1" stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="1" y1="18" x2="35" y2="18" stroke="#1A1A1A" stroke-width="0.5" stroke-opacity="0.45"/>
    <line x1="1" y1="52" x2="35" y2="52" stroke="#1A1A1A" stroke-width="0.5" stroke-opacity="0.45"/>
  </svg>

  <!-- 2014 — iPhone 6: primeiro bump, top-left -->
  <svg x="65.00" y="34.14" width="14.43" height="28.86" viewBox="0 0 39 78" fill="none">
    <rect x="1" y="1" width="37" height="76" rx="9" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="11.5" cy="11.5" r="4.5" stroke="#1A1A1A" stroke-width="1.6"/>
    <circle cx="11.5" cy="11.5" r="2.7" stroke="#1A1A1A" stroke-width="1.0"/>
    <circle cx="11.5" cy="11.5" r="1.2" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="21"   cy="11.5" r="1.9" stroke="#1A1A1A" stroke-width="0.9"/>
  </svg>

  <!-- 2016 — 7 Plus: dual horizontal -->
  <svg x="83.93" y="30.44" width="16.28" height="32.56" viewBox="0 0 44 88" fill="none">
    <rect x="1" y="1" width="42" height="86" rx="10" stroke="#1A1A1A" stroke-width="1.4"/>
    <rect x="4.5" y="5" width="18" height="11" rx="3" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="10.5" cy="10.5" r="3.2" stroke="#1A1A1A" stroke-width="1.0"/>
    <circle cx="10.5" cy="10.5" r="1.6" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="18"   cy="10.5" r="3.2" stroke="#1A1A1A" stroke-width="1.0"/>
    <circle cx="18"   cy="10.5" r="1.6" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="29.5" cy="9.5"  r="2.1" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="29.5" cy="13.5" r="1.1" stroke="#1A1A1A" stroke-width="0.7"/>
  </svg>

  <!-- 2019 — 11 Pro: módulo quadrado, triângulo de câmeras -->
  <svg x="104.71" y="28.22" width="17.39" height="34.78" viewBox="0 0 47 94" fill="none">
    <rect x="1" y="1" width="45" height="92" rx="12" stroke="#1A1A1A" stroke-width="1.4"/>
    <rect x="3.5" y="3.5" width="21" height="21" rx="5.5" stroke="#1A1A1A" stroke-width="1.3"/>
    <circle cx="10.5" cy="10.5" r="3.5" stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="10.5" cy="10.5" r="1.7" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="18.5" cy="10.5" r="3.5" stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="18.5" cy="10.5" r="1.7" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="14.5" cy="18.5" r="3.5" stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="14.5" cy="18.5" r="1.7" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="22"   cy="19"   r="1.5" fill="#1A1A1A"/>
    <circle cx="22"   cy="23.5" r="0.9" stroke="#1A1A1A" stroke-width="0.7"/>
  </svg>

  <!-- 2023 — 15 Pro Max: island + LiDAR + flash fora -->
  <svg x="126.60" y="25.26" width="18.87" height="37.74" viewBox="0 0 51 102" fill="none">
    <rect x="1" y="1" width="49" height="100" rx="14" stroke="#1A1A1A" stroke-width="1.4"/>
    <rect x="2.5" y="2.5" width="27" height="27" rx="7" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="10"  cy="10.5" r="4"   stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="10"  cy="10.5" r="2"   stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="22"  cy="10.5" r="4"   stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="22"  cy="10.5" r="2"   stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="10"  cy="22"   r="4"   stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="10"  cy="22"   r="2"   stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="22"  cy="22"   r="2.8" stroke="#1A1A1A" stroke-width="1.0"/>
    <circle cx="22"  cy="22"   r="1.4" stroke="#1A1A1A" stroke-width="0.7"/>
    <circle cx="38.5" cy="7.5" r="2.2" fill="#1A1A1A"/>
    <circle cx="38.5" cy="13"  r="1.3" stroke="#1A1A1A" stroke-width="0.8"/>
  </svg>

  <!-- 2025 — 17 Pro Max: plateau horizontal -->
  <svg x="149.97" y="23.04" width="19.98" height="39.96" viewBox="0 0 54 108" fill="none">
    <rect x="1" y="1" width="52" height="106" rx="15" stroke="#1A1A1A" stroke-width="1.4"/>
    <rect x="3" y="3" width="48" height="22" rx="10.5" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="13.5" cy="14"  r="5.5" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="13.5" cy="14"  r="3"   stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="13.5" cy="14"  r="1.4" stroke="#1A1A1A" stroke-width="0.7"/>
    <circle cx="28"   cy="8.5" r="4.5" stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="28"   cy="8.5" r="2.4" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="28"   cy="8.5" r="1.1" stroke="#1A1A1A" stroke-width="0.6"/>
    <circle cx="28"   cy="19"  r="4.5" stroke="#1A1A1A" stroke-width="1.1"/>
    <circle cx="28"   cy="19"  r="2.4" stroke="#1A1A1A" stroke-width="0.8"/>
    <circle cx="28"   cy="19"  r="1.1" stroke="#1A1A1A" stroke-width="0.6"/>
    <circle cx="41.5" cy="9"   r="2"   fill="#1A1A1A"/>
    <circle cx="41.5" cy="18"  r="2.2" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="41.5" cy="18"  r="1.1" stroke="#1A1A1A" stroke-width="0.6"/>
    <circle cx="49"   cy="14"  r="1.3" stroke="#1A1A1A" stroke-width="0.7"/>
  </svg>

  <!-- ── Timeline ── -->
  <line x1="28" y1="64" x2="172" y2="64" stroke="#1A1A1A" stroke-width="0.18" opacity="0.18"/>

  <!-- ── Ano labels ── -->
  <text font-family="Helvetica Neue, Arial, Helvetica, sans-serif" font-size="2.2" fill="#9E978A" text-anchor="middle">
    <tspan x="36.4"  y="67.5">2007</tspan>
    <tspan x="53.8"  y="67.5">2013</tspan>
    <tspan x="72.2"  y="67.5">2014</tspan>
    <tspan x="92.1"  y="67.5">2016</tspan>
    <tspan x="113.4" y="67.5">2019</tspan>
    <tspan x="136.0" y="67.5">2023</tspan>
    <tspan x="160.0" y="67.5">2025</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text
    x="100" y="75"
    text-anchor="middle"
    font-family="Helvetica Neue, Arial, Helvetica, sans-serif"
    font-size="3.2"
    letter-spacing="1"
    fill="#111111"
    opacity="0.88">todos passaram por aqui.</text>

  <!-- ── Wordmark: smart•base ── -->
  <text
    x="100" y="82"
    text-anchor="middle"
    font-family="Helvetica Neue, Arial, Helvetica, sans-serif"
    font-size="3.8">
    <tspan font-weight="300" fill="#9E978A">smart</tspan><tspan fill="#3E82F7" dx="0.5">•</tspan><tspan font-weight="700" fill="#111111" dx="0.5">base</tspan>
  </text>

</svg>
