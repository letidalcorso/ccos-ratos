<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0.3" y1="0" x2="0.7" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#1060B0"/>
    <stop offset="45%"  stop-color="#0A3870"/>
    <stop offset="100%" stop-color="#040D1C"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="rgba(4,13,28,0.0)"/>
    <stop offset="100%" stop-color="rgba(4,13,28,0.85)"/>
  </linearGradient>
  <pattern id="dots" x="0" y="0" width="96" height="96" patternUnits="userSpaceOnUse">
    <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  </pattern>
</defs>

<rect width="1080" height="1350" fill="url(#bg)"/>
<rect width="1080" height="1350" fill="url(#dots)" opacity="0.5"/>
<rect width="1080" height="1350" fill="url(#fade)"/>

<!-- Geometric accents -->
<polygon points="100,-50 280,130 100,310 -80,130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
<polygon points="980,1040 1120,1180 980,1320 840,1180" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

<!-- FTEMPER logo top -->
<text x="540" y="90" font-family="'Sora', sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">FTEMPER</text>
<line x1="420" y1="104" x2="660" y2="104" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

<!-- Main CTA headline -->
<text x="540" y="380" font-family="'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="118" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AS FERRAGENS CERTAS</text>
<text x="540" y="500" font-family="'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="118" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">EVITAM TODOS</text>
<text x="540" y="620" font-family="'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="118" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ESSES ERROS.</text>

<line x1="240" y1="668" x2="840" y2="668" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

<text x="540" y="740" font-family="'Sora', sans-serif" font-weight="300" font-size="46" fill="rgba(255,255,255,0.80)" text-anchor="middle">A FTemper tem o catálogo completo.</text>

<!-- Blue accent bar + text -->
<rect x="200" y="820" width="8" height="120" rx="4" fill="#1A00B8"/>
<text x="232" y="878" font-family="'Sora', sans-serif" font-weight="700" font-size="50" fill="#FFFFFF">ferragens com especificação</text>
<text x="232" y="936" font-family="'Sora', sans-serif" font-weight="700" font-size="50" fill="#FFFFFF">técnica para cada projeto</text>

<!-- CTA button -->
<rect x="200" y="1030" width="680" height="110" rx="55" fill="#1A00B8"/>
<text x="540" y="1100" font-family="'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NOS CHAMA.</text>

<text x="540" y="1144" font-family="'Sora', sans-serif" font-weight="400" font-size="34" fill="rgba(255,255,255,0.55)" text-anchor="middle">@ftempercomponentes</text>

<!-- Footer -->
<text x="540" y="1290" font-family="'Sora', sans-serif" font-weight="700" font-size="36" fill="rgba(255,255,255,0.70)" text-anchor="middle" letter-spacing="5">FTEMPER</text>
<line x1="430" y1="1304" x2="650" y2="1304" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
<text x="540" y="1332" font-family="'Sora', sans-serif" font-weight="300" font-size="26" fill="rgba(255,255,255,0.35)" text-anchor="middle">distribuidora de alumínio</text>
</svg>
