<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');</style>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#0D3260"/>
    <stop offset="100%" stop-color="#050F1E"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="rgba(255,255,255,0.16)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
  </linearGradient>
</defs>

<rect width="1080" height="1350" fill="url(#bg)"/>
<!-- Subtle diagonal light sweeps -->
<line x1="0" y1="860" x2="1080" y2="260" stroke="rgba(255,255,255,0.022)" stroke-width="120"/>
<line x1="0" y1="1080" x2="1080" y2="480" stroke="rgba(255,255,255,0.016)" stroke-width="80"/>
<!-- Ghost number -->
<text x="-60" y="820" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="800" fill="rgba(255,255,255,0.03)">01</text>

<!-- Progress dots (4 total, first active) -->
<circle cx="444" cy="72" r="9" fill="#FFFFFF"/>
<circle cx="480" cy="72" r="9" fill="rgba(255,255,255,0.25)"/>
<circle cx="516" cy="72" r="9" fill="rgba(255,255,255,0.25)"/>
<circle cx="552" cy="72" r="9" fill="rgba(255,255,255,0.25)"/>

<!-- Label -->
<text x="60" y="168" font-family="'Sora', sans-serif" font-weight="600" font-size="32" fill="rgba(255,255,255,0.48)" letter-spacing="6">RAZÃO</text>

<!-- Big number -->
<text x="54" y="460" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="340" fill="#FFFFFF">01</text>

<!-- Headline -->
<text x="60" y="588" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="112" fill="#FFFFFF" letter-spacing="2">SISTEMA</text>
<text x="60" y="706" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="112" fill="#5BB8F0" letter-spacing="2">PATENTEADO.</text>

<!-- Frosted card -->
<rect x="60" y="774" width="960" height="460" rx="22" fill="url(#card)"/>
<rect x="60" y="774" width="960" height="460" rx="22" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
<rect x="60" y="774" width="10" height="460" rx="5" fill="#1A6FC0"/>

<!-- Check icon -->
<circle cx="140" cy="958" r="36" fill="#1A6FC0"/>
<polyline points="122,958 136,974 162,942" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Card text -->
<text x="200" y="912" font-family="'Sora', sans-serif" font-weight="700" font-size="50" fill="#FFFFFF">Montagem exclusiva,</text>
<text x="200" y="972" font-family="'Sora', sans-serif" font-weight="700" font-size="50" fill="#FFFFFF">desenvolvida do zero.</text>
<text x="200" y="1046" font-family="'Sora', sans-serif" font-weight="400" font-size="42" fill="rgba(255,255,255,0.62)">Não é adaptação — é solução de</text>
<text x="200" y="1096" font-family="'Sora', sans-serif" font-weight="400" font-size="42" fill="rgba(255,255,255,0.62)">origem para veneziana.</text>
<text x="200" y="1170" font-family="'Sora', sans-serif" font-weight="300" font-size="36" fill="rgba(91,184,240,0.80)">Resultado de estudo aprofundado de mercado.</text>

<!-- Footer -->
<text x="540" y="1296" font-family="'Sora', sans-serif" font-weight="700" font-size="34" fill="rgba(255,255,255,0.70)" text-anchor="middle" letter-spacing="5">FTEMPER</text>
<text x="540" y="1332" font-family="'Sora', sans-serif" font-weight="300" font-size="24" fill="rgba(255,255,255,0.35)" text-anchor="middle">@ftempercomponentes</text>
</svg>
