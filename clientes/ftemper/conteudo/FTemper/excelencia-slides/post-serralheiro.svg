<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');</style>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#071830"/>
    <stop offset="50%"  stop-color="#050F20"/>
    <stop offset="100%" stop-color="#020608"/>
  </linearGradient>
  <radialGradient id="glow" cx="25%" cy="60%" r="60%" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="rgba(26,111,192,0.32)"/>
    <stop offset="100%" stop-color="rgba(26,111,192,0.00)"/>
  </radialGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#1A6FC0"/>
    <stop offset="100%" stop-color="#0D3F7A"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
  </linearGradient>
</defs>

<rect width="1080" height="1350" fill="url(#bg)"/>
<rect width="1080" height="1350" fill="url(#glow)"/>

<!-- Subtle dot grid -->
<pattern id="dots" x="0" y="0" width="96" height="96" patternUnits="userSpaceOnUse">
  <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
</pattern>
<rect width="1080" height="1350" fill="url(#dots)"/>

<!-- Geometric corner accent -->
<polygon points="0,0 240,0 0,240" fill="rgba(91,184,240,0.06)"/>
<polygon points="1080,1350 840,1350 1080,1110" fill="rgba(91,184,240,0.04)"/>

<!-- Light diagonal sweep -->
<line x1="0" y1="700" x2="1080" y2="100" stroke="rgba(255,255,255,0.018)" stroke-width="120"/>

<!-- Logo -->
<text x="540" y="92" font-family="'Sora', sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">FTEMPER</text>
<line x1="400" y1="108" x2="680" y2="108" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

<!-- "Para serralheiros" tag -->
<rect x="60" y="148" width="340" height="52" rx="6" fill="rgba(91,184,240,0.12)"/>
<rect x="60" y="148" width="340" height="52" rx="6" fill="none" stroke="rgba(91,184,240,0.30)" stroke-width="1.5"/>
<text x="230" y="182" font-family="'Sora', sans-serif" font-weight="700" font-size="22" fill="#5BB8F0" text-anchor="middle" letter-spacing="2">PARA SERRALHEIROS</text>

<!-- Ghost large text background -->
<text x="-20" y="700" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="400" fill="rgba(255,255,255,0.025)">SE</text>

<!-- Main headline — the power statement -->
<text x="60" y="360"  font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="108" fill="#FFFFFF" letter-spacing="2">O SERRALHEIRO</text>
<text x="60" y="472"  font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="108" fill="#FFFFFF" letter-spacing="2">QUE INSTALA</text>
<text x="60" y="584"  font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="108" fill="#5BB8F0" letter-spacing="2">EXCELÊNCIA</text>
<text x="60" y="696"  font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="108" fill="#5BB8F0" letter-spacing="2">VENDE EXCELÊNCIA.</text>

<line x1="60" y1="740" x2="560" y2="740" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>

<!-- Two benefit columns -->
<rect x="60" y="774" width="460" height="220" rx="18" fill="url(#card)"/>
<rect x="60" y="774" width="460" height="220" rx="18" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
<rect x="60" y="774" width="10"  height="220" rx="5" fill="#1A6FC0"/>
<text x="100" y="824" font-family="'Sora', sans-serif" font-weight="700" font-size="34" fill="rgba(91,184,240,0.90)">PRO SERRALHEIRO</text>
<text x="100" y="866" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Montagem mais rápida.</text>
<text x="100" y="904" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Tecnologia que facilita.</text>
<text x="100" y="942" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Margem que se justifica.</text>

<rect x="548" y="774" width="472" height="220" rx="18" fill="url(#card)"/>
<rect x="548" y="774" width="472" height="220" rx="18" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
<rect x="548" y="774" width="10"  height="220" rx="5" fill="#1A6FC0"/>
<text x="588" y="824" font-family="'Sora', sans-serif" font-weight="700" font-size="34" fill="rgba(91,184,240,0.90)">PRO CLIENTE</text>
<text x="588" y="866" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Ventilação ativa.</text>
<text x="588" y="904" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Design exclusivo.</text>
<text x="588" y="942" font-family="'Sora', sans-serif" font-weight="400" font-size="30" fill="rgba(255,255,255,0.70)">Alumínio que dura.</text>

<!-- Product badge -->
<rect x="60" y="1026" width="960" height="78" rx="16" fill="rgba(91,184,240,0.10)"/>
<rect x="60" y="1026" width="960" height="78" rx="16" fill="none" stroke="rgba(91,184,240,0.25)" stroke-width="1.5"/>
<text x="540" y="1055" font-family="'Sora', sans-serif" font-weight="600" font-size="24" fill="#5BB8F0" text-anchor="middle" letter-spacing="2">Sistema patenteado · Veneziana oval ou reta</text>
<text x="540" y="1090" font-family="'Sora', sans-serif" font-weight="600" font-size="24" fill="#5BB8F0" text-anchor="middle" letter-spacing="2">Ventilação ativa · Alumínio premium</text>

<!-- Blue accent bar + text -->
<rect x="60" y="1140" width="8" height="90" rx="4" fill="#1A6FC0"/>
<text x="94" y="1182" font-family="'Sora', sans-serif" font-weight="700" font-size="44" fill="#FFFFFF">Quer trabalhar com essa linha?</text>
<text x="94" y="1226" font-family="'Sora', sans-serif" font-weight="300" font-size="38" fill="rgba(255,255,255,0.60)">A gente te atende. 👇</text>

<!-- CTA button -->
<rect x="60" y="1254" width="960" height="100" rx="50" fill="url(#btn)"/>
<text x="540" y="1320" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CHAMA NO DIRECT  ↗</text>
</svg>
