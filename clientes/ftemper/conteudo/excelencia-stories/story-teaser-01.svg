<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap');</style>
  <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#071830"/>
    <stop offset="55%"  stop-color="#050F20"/>
    <stop offset="100%" stop-color="#020608"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="55%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="rgba(26,111,192,0.30)"/>
    <stop offset="100%" stop-color="rgba(26,111,192,0.00)"/>
  </radialGradient>
</defs>

<rect width="1080" height="1920" fill="url(#bg)"/>
<rect width="1080" height="1920" fill="url(#glow)"/>

<!-- Subtle dots pattern -->
<pattern id="dots" x="0" y="0" width="96" height="96" patternUnits="userSpaceOnUse">
  <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
</pattern>
<rect width="1080" height="1920" fill="url(#dots)"/>

<!-- Geometric corner -->
<polygon points="0,0 300,0 0,300" fill="rgba(91,184,240,0.05)"/>
<polygon points="1080,1920 780,1920 1080,1620" fill="rgba(91,184,240,0.04)"/>

<!-- Logo top center -->
<text x="540" y="130" font-family="'Sora', sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="7">FTEMPER</text>
<line x1="380" y1="150" x2="700" y2="150" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

<!-- Story indicator dots (3 of 3, this is 1) -->
<rect x="60"  y="56" width="290" height="8" rx="4" fill="#FFFFFF"/>
<rect x="370" y="56" width="290" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
<rect x="680" y="56" width="290" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>

<!-- Center content — large text -->
<text x="540" y="860" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="134" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ALGO NOVO</text>
<text x="540" y="1000" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="134" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ESTÁ CHEGANDO</text>
<text x="540" y="1140" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="134" fill="#5BB8F0" text-anchor="middle" letter-spacing="2">NA FTEMPER.</text>

<line x1="240" y1="1192" x2="840" y2="1192" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

<text x="540" y="1268" font-family="'Sora', sans-serif" font-weight="300" font-size="50" fill="rgba(255,255,255,0.75)" text-anchor="middle">E vai mudar o padrão</text>
<text x="540" y="1328" font-family="'Sora', sans-serif" font-weight="300" font-size="50" fill="rgba(255,255,255,0.75)" text-anchor="middle">que você entrega.</text>

<!-- Swipe up indicator -->
<text x="540" y="1780" font-family="'Sora', sans-serif" font-weight="400" font-size="36" fill="rgba(255,255,255,0.45)" text-anchor="middle">Arraste para cima  ↑</text>

<!-- Footer -->
<text x="540" y="1874" font-family="'Sora', sans-serif" font-weight="700" font-size="32" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="5">FTEMPER</text>
<text x="540" y="1908" font-family="'Sora', sans-serif" font-weight="300" font-size="24" fill="rgba(255,255,255,0.28)" text-anchor="middle">@ftempercomponentes</text>
</svg>
