<text x="60" y="686" font-family="'Morganite', 'Barlow Condensed', Impact, sans-serif" font-weight="800" font-size="106" fill="#5BB8F0" letter-spacing="2">OU RETA.</text>

<!-- Frosted card — split in two mini cards -->
<rect x="60" y="754" width="960" height="490" rx="22" fill="url(#card)"/>
<rect x="60" y="754" width="960" height="490" rx="22" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
<rect x="60" y="754" width="10" height="490" rx="5" fill="#1A6FC0"/>

<!-- Two option pills -->
<rect x="200" y="810" width="238" height="60" rx="30" fill="rgba(91,184,240,0.18)"/>
