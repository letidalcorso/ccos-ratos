<circle cx="140" cy="960" r="36" fill="#1A6FC0"/>
<polyline points="122,960 136,976 162,944" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<text x="200" y="916" font-family="'Sora', sans-serif" font-weight="700" font-size="50" fill="#FFFFFF">Diversas cores e</text>
