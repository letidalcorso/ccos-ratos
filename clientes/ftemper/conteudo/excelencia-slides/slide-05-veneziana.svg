<rect x="456" y="810" width="238" height="60" rx="30" fill="rgba(91,184,240,0.18)"/>
<rect x="456" y="810" width="238" height="60" rx="30" fill="none" stroke="rgba(91,184,240,0.40)" stroke-width="1.5"/>
