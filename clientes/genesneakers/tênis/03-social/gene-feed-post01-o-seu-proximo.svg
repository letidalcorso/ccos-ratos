<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!--
    Gene Sneakers · Post 01 "O seu próximo." · Feed 4:5
    Ambiente: Daylight · Pilar 1 (Produto com Vida)
    Proibido: pattern, wave, bloom, chrome, logo completo, tagline
    Placeholder de imagem a ser substituído por foto editorial de tênis em luz natural
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .display { font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:700; text-transform:uppercase; }
      .mono    { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
      .mono-r  { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.05em; }
    </style>
  </defs>

  <!-- ================ ZONA IMAGEM (72%) ================ -->
  <rect x="0" y="0" width="1080" height="972" fill="#F2EFE9"/>

  <!-- Moldura tracejada + label IMAGE (fallback para mockup) -->
  <rect x="40" y="40" width="1000" height="892" fill="none" stroke="#A6A4A1" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.4"/>
  <text x="540" y="498" class="mono" font-size="26" fill="#A6A4A1" text-anchor="middle" letter-spacing="0.32em">IMAGE</text>
  <text x="540" y="536" class="mono-r" font-size="16" fill="#A6A4A1" text-anchor="middle" opacity="0.75">editorial · luz natural · 4:5</text>

  <!-- ================ BADGE ORDER OPEN (topo direito, sobre a imagem) ================ -->
  <g>
    <rect x="770" y="40" width="270" height="54" rx="3" fill="#C4FF3C"/>
    <!-- check mark desenhado (não depender de glyph) -->
    <path d="M 798 68 L 810 80 L 830 60" stroke="#0D0D0D" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="846" y="76" class="mono" font-size="22" fill="#0D0D0D" letter-spacing="0.14em">ORDER OPEN</text>
  </g>

  <!-- ================ ZONA TIPOGRAFIA (28%) ================ -->
  <rect x="0" y="972" width="1080" height="378" fill="#F2EFE9"/>

  <!-- HERO tipográfico — canto inferior esquerdo, margem 64 -->
  <!-- leading 0.90 · font-size 168 · tracking -30/1000 -->
  <text x="64" y="1144" class="display" font-size="168" fill="#0D0D0D" letter-spacing="-5">O SEU</text>
  <text x="64" y="1295" class="display" font-size="168" fill="#0D0D0D" letter-spacing="-5">PRÓXIMO.</text>

  <!-- ASSINATURA — canto inferior direito, baseline alinhada com PRÓXIMO. -->
  <text x="1040" y="1295" class="mono-r" font-size="24" fill="#0D0D0D" text-anchor="end" letter-spacing="0.05em">@gene.sneakers</text>
</svg>
