<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .display  { font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:900; letter-spacing:-0.02em; text-transform:uppercase; }
      .display-b{ font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:700; letter-spacing:-0.01em; }
      .mono     { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
      .mono-r   { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.12em; }
    </style>
  </defs>

  <!-- ACID field -->
  <rect width="1080" height="1920" fill="#C4FF3C"/>

  <!-- Top kicker simples (sem // tag) -->
  <text x="540" y="260" class="mono" font-size="24" fill="#0D0D0D" text-anchor="middle">— save the date</text>

  <!-- HERO: data gigante em Carbon -->
  <text x="540" y="720" class="display" font-size="320" fill="#0D0D0D" text-anchor="middle">21.04</text>

  <!-- Bone divider grounding -->
  <line x1="380" y1="790" x2="700" y2="790" stroke="#F2EFE9" stroke-width="3"/>

  <!-- Pill "ESTÁ A CAMINHO" (substitui montanha/spike) -->
  <g>
    <rect x="300" y="900" width="480" height="90" rx="45" ry="45" fill="none" stroke="#0D0D0D" stroke-width="3"/>
    <circle cx="360" cy="945" r="10" fill="#0D0D0D"/>
    <text x="560" y="958" class="mono" font-size="32" fill="#0D0D0D" text-anchor="middle">está a caminho</text>
  </g>

  <!-- Main statement -->
  <text x="540" y="1220" class="display" font-size="150" fill="#0D0D0D" text-anchor="middle">primeiro</text>
  <text x="540" y="1370" class="display" font-size="150" fill="#0D0D0D" text-anchor="middle">drop.</text>

  <!-- Bloco CTA (Carbon block) -->
  <rect x="180" y="1480" width="720" height="160" fill="#0D0D0D"/>
  <text x="540" y="1542" class="display" font-size="52" fill="#F2EFE9" text-anchor="middle">qual modelo</text>
  <text x="540" y="1605" class="display" font-size="52" fill="#C4FF3C" text-anchor="middle">você quer? →</text>

  <!-- Countdown dots em Carbon -->
  <g fill="#0D0D0D">
    <circle cx="460" cy="1740" r="6"/>
    <circle cx="500" cy="1740" r="6"/>
    <circle cx="540" cy="1740" r="6"/>
    <circle cx="580" cy="1740" r="6"/>
    <circle cx="620" cy="1740" r="6"/>
  </g>

  <!-- Footer -->
  <text x="540" y="1810" class="mono-r" font-size="18" fill="#0D0D0D" text-anchor="middle" opacity="0.65">gene sneakers · lançamento</text>
</svg>
