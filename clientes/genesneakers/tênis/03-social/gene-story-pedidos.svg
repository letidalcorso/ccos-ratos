<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .display  { font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:900; letter-spacing:-0.02em; text-transform:uppercase; }
      .display-b{ font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:700; letter-spacing:-0.01em; }
      .mono     { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
      .mono-r   { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.12em; }
    </style>
    <linearGradient id="chromeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D26"/>
      <stop offset="100%" stop-color="#2A3845"/>
    </linearGradient>
    <radialGradient id="chromeGlow" cx="75%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#8FA5B5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#141D26" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- CHROME field -->
  <rect width="1080" height="1920" fill="url(#chromeBg)"/>
  <rect width="1080" height="1920" fill="url(#chromeGlow)"/>

  <!-- Top kicker simples -->
  <text x="80" y="260" class="mono" font-size="24" fill="#C4FF3C">— como funciona</text>

  <!-- Title -->
  <text x="80" y="480" class="display" font-size="135" fill="#E8ECF0">pedido</text>
  <text x="80" y="620" class="display" font-size="135" fill="#E8ECF0">em 3 passos.</text>
  <circle cx="880" cy="608" r="12" fill="#C4FF3C"/>

  <!-- Divider -->
  <line x1="80" y1="760" x2="1000" y2="760" stroke="#8FA5B5" stroke-width="1" opacity="0.25"/>

  <!-- Step 01 -->
  <text x="80" y="880" class="mono" font-size="30" fill="#C4FF3C">01 / input</text>
  <line x1="80" y1="915" x2="1000" y2="915" stroke="#8FA5B5" stroke-width="1" opacity="0.35"/>
  <text x="80" y="1005" class="display-b" font-size="72" fill="#E8ECF0">me fala o modelo.</text>
  <text x="80" y="1055" class="mono-r" font-size="20" fill="#8FA5B5">qualquer marca · qualquer numeração</text>

  <!-- Step 02 -->
  <text x="80" y="1190" class="mono" font-size="30" fill="#C4FF3C">02 / curadoria</text>
  <line x1="80" y1="1225" x2="1000" y2="1225" stroke="#8FA5B5" stroke-width="1" opacity="0.35"/>
  <text x="80" y="1315" class="display-b" font-size="72" fill="#E8ECF0">a gene busca.</text>
  <text x="80" y="1365" class="mono-r" font-size="20" fill="#8FA5B5">importado · autenticado · sob encomenda</text>

  <!-- Step 03 — tagline embutida -->
  <text x="80" y="1500" class="mono" font-size="30" fill="#C4FF3C">03 / entrega</text>
  <line x1="80" y1="1535" x2="1000" y2="1535" stroke="#8FA5B5" stroke-width="1" opacity="0.35"/>
  <text x="80" y="1625" class="display-b" font-size="72" fill="#E8ECF0">você com <tspan fill="#C4FF3C">estilo nos pés.</tspan></text>
  <text x="80" y="1675" class="mono-r" font-size="20" fill="#8FA5B5">rastreado do envio à porta</text>

  <!-- Footer -->
  <line x1="80" y1="1810" x2="260" y2="1810" stroke="#8FA5B5" stroke-width="1" opacity="0.4"/>
  <text x="280" y="1818" class="mono-r" font-size="18" fill="#8FA5B5">gene sneakers · 2026</text>
</svg>
