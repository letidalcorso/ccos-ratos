<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!--
    Gene Sneakers · Post 01 "O seu próximo." · Story / Reel Cover 9:16
    Mesmo layout adaptado do feed 4:5 — imagem 72%, bone 28%
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .display { font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:700; text-transform:uppercase; }
      .mono    { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
      .mono-r  { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.05em; }
    </style>
  </defs>

  <!-- ================ ZONA IMAGEM (72% de 1920 ≈ 1382) ================ -->
  <rect x="0" y="0" width="1080" height="1382" fill="#F2EFE9"/>

  <!-- Moldura tracejada + label IMAGE -->
  <rect x="40" y="40" width="1000" height="1302" fill="none" stroke="#A6A4A1" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.4"/>
  <text x="540" y="705" class="mono" font-size="28" fill="#A6A4A1" text-anchor="middle" letter-spacing="0.32em">IMAGE</text>
  <text x="540" y="745" class="mono-r" font-size="18" fill="#A6A4A1" text-anchor="middle" opacity="0.75">editorial · luz natural · 9:16</text>

  <!-- ================ BADGE ORDER OPEN (topo direito) ================ -->
  <g>
    <rect x="740" y="50" width="300" height="58" rx="3" fill="#C4FF3C"/>
    <path d="M 772 82 L 784 94 L 806 72" stroke="#0D0D0D" stroke-width="3.5" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="822" y="90" class="mono" font-size="24" fill="#0D0D0D" letter-spacing="0.14em">ORDER OPEN</text>
  </g>

  <!-- ================ ZONA TIPOGRAFIA (28%) ================ -->
  <rect x="0" y="1382" width="1080" height="538" fill="#F2EFE9"/>

  <!-- HERO tipográfico -->
  <text x="64" y="1620" class="display" font-size="200" fill="#0D0D0D" letter-spacing="-6">O SEU</text>
  <text x="64" y="1800" class="display" font-size="200" fill="#0D0D0D" letter-spacing="-6">PRÓXIMO.</text>

  <!-- ASSINATURA -->
  <text x="1040" y="1800" class="mono-r" font-size="26" fill="#0D0D0D" text-anchor="end" letter-spacing="0.05em">@gene.sneakers</text>
</svg>
