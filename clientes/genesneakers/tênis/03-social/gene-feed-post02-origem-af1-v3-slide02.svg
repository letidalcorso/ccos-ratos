<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!--
    Gene Sneakers · Post 02 · ORIGEM #01 — AIR FORCE 1
    Slide 2/3 · Feed 4:5 (1080×1350) · Ambiente Carbon puro · Texto-first
    Handoff v3.0 · 21.04.2026
  -->
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
      .mono-r { font-family: 'IBM Plex Mono', monospace; font-weight: 400; }
      .display-bold { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; }
      .display-regular { font-family: 'Big Shoulders Display', sans-serif; font-weight: 400; }
    ]]></style>
  </defs>

  <!-- Campo Carbon puro -->
  <rect width="1080" height="1350" fill="#0D0D0D"/>

  <!-- BLOCO 1 · Título "The Three Amigos." em Display Bold -->
  <text x="80" y="260" class="display-bold" font-size="92" fill="#F2EFE9" letter-spacing="-3">The Three Amigos.</text>

  <!-- BLOCO 2 · Nomes em Mono (ficha técnica) -->
  <text x="80" y="430" class="mono-r" font-size="30" fill="#F2EFE9" letter-spacing="0.02em">Freddy Hicks.</text>
  <text x="80" y="478" class="mono-r" font-size="30" fill="#F2EFE9" letter-spacing="0.02em">Darryl Jenkins.</text>
  <text x="80" y="526" class="mono-r" font-size="30" fill="#F2EFE9" letter-spacing="0.02em">Tony Roberts.</text>

  <!-- BLOCO 3 · Contexto em Display Regular (prosa editorial) -->
  <!-- Parágrafo 1 -->
  <text x="80" y="720" class="display-regular" font-size="46" fill="#F2EFE9" letter-spacing="-0.5">Três lojistas da Downtown Locker Room,</text>
  <text x="80" y="774" class="display-regular" font-size="46" fill="#F2EFE9" letter-spacing="-0.5">Baltimore.</text>

  <!-- Parágrafo 2 · separado por ~60px de ar -->
  <text x="80" y="900" class="display-regular" font-size="46" fill="#F2EFE9" letter-spacing="-0.5">Compraram todo o estoque que sobrou</text>
  <text x="80" y="954" class="display-regular" font-size="46" fill="#F2EFE9" letter-spacing="-0.5">em 1984 — e pressionaram a Nike</text>
  <text x="80" y="1008" class="display-regular" font-size="46" fill="#F2EFE9" letter-spacing="-0.5">a voltar a produzir.</text>

  <!-- Slide marker · sutil -->
  <text x="1040" y="1310" class="mono-r" font-size="14" fill="#3A3A3A" text-anchor="end" letter-spacing="0.3em">02 / 03</text>
</svg>
