<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!--
    Gene Sneakers · Post 02 · ORIGEM #01 — AIR FORCE 1
    Slide 1/3 · Feed 4:5 (1080×1350) · Ambiente Carbon
    Handoff v3.0 · 21.04.2026
  -->
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
      .mono-r { font-family: 'IBM Plex Mono', monospace; font-weight: 400; }
      .display-bold { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; }
      .display-regular { font-family: 'Big Shoulders Display', sans-serif; font-weight: 400; }
    ]]></style>
    <linearGradient id="fadeToCarbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0D0D0D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Campo Carbon de base -->
  <rect width="1080" height="1350" fill="#0D0D0D"/>

  <!-- Zona de imagem (0-810px) · placeholder editorial -->
  <g id="IMAGE-PLACEHOLDER">
    <rect x="0" y="0" width="1080" height="810" fill="#1A1A1A"/>
    <text x="540" y="405" class="mono-r" font-size="14" fill="#A6A4A1" text-anchor="middle" letter-spacing="0.3em" opacity="0.5">IMAGE · AF1 EDITORIAL · LUZ DRAMÁTICA · FUNDO ESCURO</text>
    <!-- Fade para Carbon na parte inferior da imagem -->
    <rect x="0" y="610" width="1080" height="200" fill="url(#fadeToCarbon)"/>
  </g>

  <!-- Zona de texto (810-1350px) -->

  <!-- TIER 1 · Ano "1982" em Mono Slate -->
  <text x="64" y="878" class="mono-r" font-size="22" fill="#A6A4A1" letter-spacing="0.08em">1982</text>

  <!-- TIER 2 · "AIR FORCE 1" em Display Bold Bone monumental -->
  <text x="60" y="1010" class="display-bold" font-size="130" fill="#F2EFE9" letter-spacing="-4">AIR FORCE 1</text>

  <!-- TIER 3 · Origem em 2 linhas Display Regular Bone -->
  <text x="64" y="1095" class="display-regular" font-size="42" fill="#F2EFE9" letter-spacing="-0.5">Nike tirou de linha em 1984.</text>
  <text x="64" y="1145" class="display-regular" font-size="42" fill="#F2EFE9" letter-spacing="-0.5">Três lojistas de Baltimore salvaram.</text>

  <!-- Slide marker · canto inferior direito pra orientação no carrossel · sutil -->
  <text x="1040" y="1310" class="mono-r" font-size="14" fill="#3A3A3A" text-anchor="end" letter-spacing="0.3em">01 / 03</text>
</svg>
