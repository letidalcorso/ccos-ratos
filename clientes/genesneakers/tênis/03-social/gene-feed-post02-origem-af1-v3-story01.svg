<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!--
    Gene Sneakers · Post 02 · ORIGEM #01 — AIR FORCE 1
    Story 1/3 · 9:16 (1080×1920) · Ambiente Carbon
  -->
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
      .mono-r { font-family: 'IBM Plex Mono', monospace; font-weight: 400; }
      .display-bold { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; }
      .display-regular { font-family: 'Big Shoulders Display', sans-serif; font-weight: 400; }
    ]]></style>
    <linearGradient id="fadeToCarbonStory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0D0D0D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Campo Carbon -->
  <rect width="1080" height="1920" fill="#0D0D0D"/>

  <!-- Zona imagem (0-1200px) -->
  <g id="IMAGE-PLACEHOLDER">
    <rect x="0" y="0" width="1080" height="1200" fill="#1A1A1A"/>
    <text x="540" y="600" class="mono-r" font-size="16" fill="#A6A4A1" text-anchor="middle" letter-spacing="0.3em" opacity="0.5">IMAGE · AF1 EDITORIAL · LUZ DRAMÁTICA</text>
    <rect x="0" y="1000" width="1080" height="200" fill="url(#fadeToCarbonStory)"/>
  </g>

  <!-- Ano "1982" mono Slate -->
  <text x="80" y="1320" class="mono-r" font-size="28" fill="#A6A4A1" letter-spacing="0.08em">1982</text>

  <!-- "AIR FORCE 1" hero -->
  <text x="76" y="1500" class="display-bold" font-size="160" fill="#F2EFE9" letter-spacing="-5">AIR FORCE 1</text>

  <!-- Origem 2 linhas -->
  <text x="80" y="1620" class="display-regular" font-size="54" fill="#F2EFE9" letter-spacing="-0.5">Nike tirou de linha em 1984.</text>
  <text x="80" y="1685" class="display-regular" font-size="54" fill="#F2EFE9" letter-spacing="-0.5">Três lojistas de Baltimore salvaram.</text>

  <!-- Slide marker -->
  <text x="1000" y="1870" class="mono-r" font-size="16" fill="#3A3A3A" text-anchor="end" letter-spacing="0.3em">01 / 03</text>
</svg>
