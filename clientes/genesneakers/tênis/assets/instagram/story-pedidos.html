<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet"/>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      width:1080px;height:1920px;overflow:hidden;
      background:#0D0D0D;color:#F2EFE9;
      font-family:'IBM Plex Mono',monospace;
      -webkit-font-smoothing:antialiased;
    }
    .story{
      width:1080px;height:1920px;
      padding:90px 88px;
      display:flex;flex-direction:column;
      justify-content:space-between;
    }
    .label{
      font-size:22px;letter-spacing:.22em;text-transform:uppercase;
      color:#CBF23D;font-weight:500;
    }
    .big{
      font-family:'Big Shoulders Display',sans-serif;
      font-weight:900;text-transform:uppercase;
      line-height:.92;color:#F2EFE9;
    }
    .sub{font-size:28px;color:#A6A4A1;line-height:1.7;letter-spacing:.02em;}
    .acid{color:#CBF23D;}
    .bottom{font-size:20px;letter-spacing:.14em;color:#A6A4A1;}
    .divider{height:2px;background:#CBF23D;width:100%;margin:0;}
  .step{display:flex;align-items:baseline;gap:36px;margin-bottom:64px;}
  .step-num{font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:96px;color:#CBF23D;line-height:1;flex-shrink:0;width:120px;}
  .step-text{font-size:38px;line-height:1.4;color:#F2EFE9;}
  .step-divider{height:1px;background:rgba(255,255,255,.08);margin-bottom:64px;}
</style>
</head><body><div class="story">
  <div class="label">COMO PEDIR —</div>
  <div>
    <div class="divider" style="margin-bottom:80px;"></div>
    <div class="step">
      <span class="step-num">01</span>
      <span class="step-text">Me fala o<br/>modelo.</span>
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <span class="step-num">02</span>
      <span class="step-text">A Gene<br/>busca.</span>
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <span class="step-num">03</span>
      <span class="step-text">Chega<br/>pra você.</span>
    </div>
    <div style="height:16px;"></div>
    <div class="sub" style="font-size:26px;">Via WhatsApp. Simples assim.</div>
  </div>
  <div class="bottom"><span class="acid">↓ nos fala qual.</span></div>
</div></body></html>
