<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1920px;overflow:hidden;-webkit-font-smoothing:antialiased;}

  .story{
    position:relative;
    width:1080px;height:1920px;
    /* Atmosfera: glow escuro de PRESS/ACID vindo de baixo — profundidade sem perder o dark */
    background:
      radial-gradient(ellipse 1400px 1000px at 50% 115%, rgba(140,166,45,0.22) 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 105% -5%, rgba(203,242,61,0.05) 0%, transparent 50%),
      radial-gradient(ellipse 500px 400px at -10% 40%, rgba(242,239,233,0.03) 0%, transparent 50%),
      #0D0D0D;
    overflow:hidden;
    font-family:'IBM Plex Mono',monospace;
  }

  /* ── Pegada fantasma grande ─────────────────── */
  .pegada-bg{
    position:absolute;
    width:1700px;
    right:-420px;
    top:42%;
    transform:translateY(-50%) rotate(-90deg) scaleX(-1);
    opacity:0.12;
    pointer-events:none;
  }

  /* ── Texto vertical na borda esquerda ────────── */
  .side-label{
    position:absolute;
    left:-168px;
    top:50%;
    transform:translateY(-50%) rotate(-90deg);
    font-size:17px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:rgba(166,164,161,0.35);
    white-space:nowrap;
    z-index:2;
  }

  /* ── Zona principal ──────────────────────────── */
  .zone-top{
    position:absolute;
    top:88px;left:88px;right:88px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:3;
  }
  .label{
    font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#CBF23D;font-weight:500;
  }
  .badge-outline{
    border:1.5px solid rgba(242,239,233,0.22);
    border-radius:100px;
    padding:10px 26px;
    font-size:17px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(242,239,233,0.55);
  }

  /* ── Headline hero ───────────────────────────── */
  .zone-hero{
    position:absolute;
    left:88px;
    top:340px;
    z-index:3;
  }
  .headline-sub{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;font-size:148px;
    text-transform:uppercase;line-height:.9;
    color:#F2EFE9;
    margin-bottom:0;
  }
  /* "DROP." em ACID oversized — quase sai da tela */
  .headline-main{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;font-size:228px;
    text-transform:uppercase;line-height:.88;
    color:#CBF23D;
    margin-left:-6px; /* compensação óptica */
    white-space:nowrap;
  }

  /* ── Linha ACID full-width ───────────────────── */
  .acid-rule{
    position:absolute;
    left:0;right:0;
    height:2px;
    background:linear-gradient(90deg, transparent 0%, #CBF23D 15%, #CBF23D 85%, transparent 100%);
    z-index:3;
  }

  /* ── Linha de dado pós-rule ──────────────────── */
  .data-row{
    position:absolute;
    left:88px;right:88px;
    display:flex;gap:48px;align-items:center;
    z-index:3;
  }
  .data-item{
    font-size:19px;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(203,242,61,0.7);
  }
  .data-sep{
    width:1px;height:20px;
    background:rgba(242,239,233,0.15);
  }

  /* ── Glass card ──────────────────────────────── */
  .glass{
    position:absolute;
    left:88px;right:88px;
    background:rgba(242,239,233,0.045);
    border:1px solid rgba(242,239,233,0.10);
    border-radius:20px;
    padding:52px;
    z-index:3;
    overflow:hidden;
  }
  /* Borda luminosa no topo do card */
  .glass::before{
    content:'';
    position:absolute;
    top:0;left:60px;right:60px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(203,242,61,0.45),transparent);
  }
  .glass-q{
    font-size:36px;line-height:1.45;
    color:rgba(242,239,233,0.8);
    margin-bottom:32px;
  }
  .glass-divider{
    height:1px;background:rgba(242,239,233,0.07);margin-bottom:28px;
  }
  .glass-cta{
    font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#CBF23D;
  }

  /* ── Footer ──────────────────────────────────── */
  .zone-footer{
    position:absolute;
    bottom:80px;left:88px;right:88px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:3;
  }
  .footer-brand{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;font-size:28px;
    text-transform:uppercase;color:rgba(242,239,233,0.2);letter-spacing:.08em;
  }
  .footer-tag{
    font-size:16px;letter-spacing:.15em;color:rgba(166,164,161,0.45);
  }

  /* ── Badge ACID sólido ───────────────────────── */
  .badge-acid{
    background:#CBF23D;color:#0D0D0D;
    border-radius:100px;
    padding:10px 26px;
    font-size:17px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#0D0D0D;flex-shrink:0;}
</style>
</head>
