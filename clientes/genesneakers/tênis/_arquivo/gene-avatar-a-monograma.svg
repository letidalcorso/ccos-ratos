<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;display=swap');
      .display { font-family: 'Big Shoulders Display', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; }
      .display-r { font-family: 'Big Shoulders Display', 'Arial Black', sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- CARBON field -->
  <rect width="1080" height="1080" fill="#0D0D0D"/>

  <!-- GENE dominante em Bone -->
  <text x="540" y="570" class="display" font-size="300" fill="#F2EFE9" text-anchor="middle">GENE</text>

  <!-- Filete Acid (divider sistêmico) -->
  <line x1="410" y1="615" x2="670" y2="615" stroke="#CBF23D" stroke-width="4"/>

  <!-- SNEAKERS identificador em Acid -->
  <text x="540" y="700" class="display-r" font-size="90" fill="#CBF23D" text-anchor="middle">SNEAKERS</text>
</svg>
