    <path class="stroke-ink" d="M 48 -140 C 48 -112, -48 -112, -48 -84 C -48 -56, 48 -56, 48 -28 C 48 0, -48 0, -48 28 C -48 56, 48 56, 48 84 C 48 112, -48 112, -48 140"/>
    <path class="stroke-ink" d="M -24 -140 C -24 -112, 24 -112, 24 -84 C 24 -56, -24 -56, -24 -28 C -24 0, 24 0, 24 28 C 24 56, -24 56, -24 84 C -24 112, 24 112, 24 140"/>
