<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="6480" height="1080" viewBox="0 0 6480 1080">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .label { font-size: 22px; fill: #3C3C3C; letter-spacing: 4px; font-weight: 400; }
      .corner { font-size: 22px; fill: #3C3C3C; letter-spacing: 3px; }
      .display { font-size: 148px; font-weight: 900; letter-spacing: -4px; text-transform: uppercase; }
      .display-xl { font-size: 200px; font-weight: 900; letter-spacing: -6px; text-transform: uppercase; }
      .title { font-size: 56px; font-weight: 900; letter-spacing: 0px; text-transform: uppercase; }
      .title-sm { font-size: 44px; font-weight: 900; letter-spacing: 0px; text-transform: uppercase; }
      .body { font-size: 34px; font-weight: 400; letter-spacing: 0.5px; }
      .micro { font-size: 22px; font-weight: 400; letter-spacing: 6px; text-transform: uppercase; }
      .year-tag { font-size: 24px; font-weight: 700; letter-spacing: 8px; text-transform: uppercase; }
      .cta-main { font-size: 120px; font-weight: 900; letter-spacing: -3px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- ═══ SLIDE 1 — CAPA ═══ -->
  <rect x="0" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="80" y="52" class="micro" fill="#3C3C3C">A História do Dunk</text>
  <text x="1000" y="52" text-anchor="end" class="corner" fill="#3C3C3C">1 / 6</text>
  <!-- era number — very large -->
  <text x="80" y="600" class="display-xl" fill="#F3EFE6">1985.</text>
  <!-- sub lines -->
  <text x="80" y="730" class="title" fill="#3C3C3C">Um tênis de basquete.</text>
  <text x="80" y="800" class="title" fill="#C4FF3C">Uma revolução.</text>
  <line x1="1078" y1="0" x2="1078" y2="1080" stroke="#2a2a2a" stroke-width="2"/>

  <!-- ═══ SLIDE 2 — BASQUETE UNIVERSITÁRIO ═══ -->
  <rect x="1080" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="2060" y="52" text-anchor="end" class="corner" fill="#3C3C3C">2 / 6</text>
  <text x="1160" y="200" class="year-tag" fill="#C4FF3C">1985 — Basquete Universitário</text>
  <!-- statement -->
  <text x="1160" y="380" class="title-sm" fill="#F3EFE6">ERA O TÊNIS DO TIME</text>
  <text x="1160" y="440" class="title-sm" fill="#F3EFE6">— NÃO DO ATLETA.</text>
  <!-- divider -->
  <line x1="1160" y1="500" x2="1360" y2="500" stroke="#C4FF3C" stroke-width="3"/>
  <!-- body -->
  <text x="1160" y="570" class="body" fill="#3C3C3C">O Nike Dunk nasceu para o basquete</text>
  <text x="1160" y="618" class="body" fill="#3C3C3C">universitário americano. Cada time</text>
  <text x="1160" y="666" class="body" fill="#3C3C3C">tinha a sua colorway. A identidade</text>
  <text x="1160" y="714" class="body" fill="#3C3C3C">era coletiva — não individual.</text>
  <line x1="2158" y1="0" x2="2158" y2="1080" stroke="#2a2a2a" stroke-width="2"/>

  <!-- ═══ SLIDE 3 — A RUA ═══ -->
  <rect x="2160" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="3140" y="52" text-anchor="end" class="corner" fill="#3C3C3C">3 / 6</text>
  <text x="2240" y="200" class="year-tag" fill="#C4FF3C">Anos 90 — A Rua Decidiu</text>
  <!-- big statement -->
  <text x="2240" y="420" class="display" fill="#F3EFE6">OS</text>
  <text x="2240" y="570" class="display" fill="#F3EFE6">SKATERS</text>
  <text x="2240" y="720" class="display" fill="#F3EFE6">VIRAM</text>
  <text x="2240" y="870" class="display" fill="#F3EFE6">PRIMEIRO.</text>
  <line x1="3238" y1="0" x2="3238" y2="1080" stroke="#2a2a2a" stroke-width="2"/>

  <!-- ═══ SLIDE 4 — 2000 ═══ -->
  <rect x="3240" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="4220" y="52" text-anchor="end" class="corner" fill="#3C3C3C">4 / 6</text>
  <text x="3320" y="200" class="year-tag" fill="#C4FF3C">2000 — Be True To Your School</text>
  <!-- program name in quotes -->
  <text x="3320" y="390" class="title" fill="#F3EFE6">"BE TRUE</text>
  <text x="3320" y="460" class="title" fill="#F3EFE6">TO YOUR</text>
  <text x="3320" y="530" class="title" fill="#F3EFE6">SCHOOL."</text>
  <!-- divider -->
  <line x1="3320" y1="580" x2="3520" y2="580" stroke="#C4FF3C" stroke-width="3"/>
  <!-- body -->
  <text x="3320" y="650" class="body" fill="#3C3C3C">Colorways exclusivas por universidade.</text>
  <text x="3320" y="698" class="body" fill="#3C3C3C">Tiragens limitadas. Viraram objetos</text>
  <text x="3320" y="746" class="body" fill="#3C3C3C">de coleção antes do conceito existir.</text>
  <line x1="4318" y1="0" x2="4318" y2="1080" stroke="#2a2a2a" stroke-width="2"/>

  <!-- ═══ SLIDE 5 — A CULTURA DECIDIU ═══ -->
  <rect x="4320" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="5300" y="52" text-anchor="end" class="corner" fill="#3C3C3C">5 / 6</text>
  <!-- main statement -->
  <text x="4400" y="380" class="display" fill="#F3EFE6">A CULTURA</text>
  <text x="4400" y="540" class="display" fill="#C4FF3C">DECIDIU.</text>
  <!-- divider -->
  <line x1="4400" y1="590" x2="4600" y2="590" stroke="#3C3C3C" stroke-width="2"/>
  <!-- body -->
  <text x="4400" y="660" class="body" fill="#3C3C3C">Não o marketing. Hoje é um dos</text>
  <text x="4400" y="708" class="body" fill="#3C3C3C">modelos mais requisitados do</text>
  <text x="4400" y="756" class="body" fill="#3C3C3C">mercado global. A rua disse que</text>
  <text x="4400" y="804" class="body" fill="#3C3C3C">sim — e pronto.</text>
  <line x1="5398" y1="0" x2="5398" y2="1080" stroke="#2a2a2a" stroke-width="2"/>

  <!-- ═══ SLIDE 6 — CTA ═══ -->
  <rect x="5400" y="0" width="1080" height="1080" fill="#080808"/>
  <text x="6380" y="52" text-anchor="end" class="corner" fill="#3C3C3C">6 / 6</text>
  <!-- cta -->
  <text x="5480" y="310" class="cta-main" fill="#F3EFE6">DUNK</text>
  <text x="5480" y="450" class="cta-main" fill="#F3EFE6">SOB</text>
  <text x="5480" y="590" class="cta-main" fill="#F3EFE6">ENCO-</text>
  <text x="5480" y="730" class="cta-main" fill="#F3EFE6">MENDA.</text>
  <!-- handle -->
  <text x="5480" y="820" class="micro" fill="#C4FF3C">@genesneakers</text>
  <!-- wordmark -->
  <image href="../../02_branding/identidade_visual/gene-wordmark.svg" x="5480" y="880" width="440" height="213"/>

</svg>
