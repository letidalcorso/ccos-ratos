<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Gene Sneakers — Adidas Samba · 01/05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --carbon: #0D0D0D;
      --bone:   #F2EFE9;
      --acid:   #CBF23D;
      --press:  #8CA62D;
      --slate:  #A6A4A1;
    }
    body {
      background: #111;
      padding: 40px 24px 80px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .header  { color: var(--acid); font-size: 11px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 4px; }
    .subhead { color: #444; font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; }
    .env     { color: var(--press); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }

    .wrap  { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    .label { color: #444; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }

    .slide {
      width: 270px;
      height: 338px;
      background: var(--carbon);
      position: relative;
      overflow: hidden;
    }

    /* zona de imagem — tira vertical direita */
    .img-zone {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 45%;
      background: repeating-linear-gradient(
        45deg, #111, #111 3px, #161616 3px, #161616 6px
      );
      border-left: 1px dashed #1e1e1e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; padding: 8px; text-align: center;
    }
    .img-zone .tag  { font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: #2a2a2a; letter-spacing: 2px; text-transform: uppercase; }
    .img-zone .main { font-family: 'IBM Plex Mono', monospace; font-size: 6px; color: #222; }

    /* gradiente da esquerda cobrindo borda da foto */
    .grad-left {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 65%;
      background: linear-gradient(to right, var(--carbon) 60%, transparent 100%);
    }

    .brand {
      position: absolute;
      top: 14px; left: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px; color: #2a2a2a;
      letter-spacing: 3px; text-transform: uppercase;
    }

    .tag-top {
      position: absolute;
      top: 42px; left: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px; color: var(--press);
      letter-spacing: 3px; text-transform: uppercase;
    }

    .headline {
      position: absolute;
      top: 68px; left: 14px; right: 14px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 48px;
      color: var(--bone);
      text-transform: uppercase;
      line-height: 0.84;
      letter-spacing: -1px;
    }

    .year {
      position: absolute;
      bottom: 76px; left: 14px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: #1e1e1e;
      letter-spacing: 2px;
    }

    .sub {
      position: absolute;
      bottom: 40px; left: 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px; color: var(--slate);
      letter-spacing: 1px; line-height: 1.6;
    }

    .bottom {
      position: absolute;
      bottom: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .cta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px; color: #2a2a2a;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .logo {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 16px; color: #1a1a1a;
      letter-spacing: 4px; text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="header">Gene Sneakers — Post Estático</div>
<div class="subhead">01/05 · Produto com vida · Adidas Samba · 1080×1350px</div>
<div class="env">/ENV-01 · CARBON</div>

<div class="wrap">
  <div class="label">estático / produto</div>
  <div class="slide">
    <div class="img-zone">
      <div class="tag">[ foto ]</div>
      <div class="main">Samba OG</div>
      <div class="main">lifestyle urbano</div>
    </div>
    <div class="grad-left"></div>
    <div class="brand">Gene Sneakers</div>
    <div class="tag-top">/adidas samba · 1950</div>
    <div class="headline">
      O SAMBA<br>NÃO PEDE<br>LICENÇA.
    </div>
    <div class="year">1950 —</div>
    <div class="sub">Setenta anos. Ainda aqui.<br>Encomenda aberta.</div>
    <div class="bottom">
      <div class="cta">Manda mensagem.</div>
      <div class="logo">Gene</div>
    </div>
  </div>
</div>

</body>
</html>
