<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="5400" height="1920" viewBox="0 0 5400 1920">
  <defs>
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .label { font-size: 32px; fill: #3C3C3C; letter-spacing: 4px; font-weight: 400; text-transform: uppercase; }
      .corner { font-size: 28px; fill: #3C3C3C; letter-spacing: 4px; font-weight: 400; }
      .handle { font-size: 28px; fill: #3C3C3C; letter-spacing: 6px; font-weight: 400; }
      .hero { font-size: 200px; font-weight: 900; letter-spacing: -4px; text-transform: uppercase; }
      .hero-lg { font-size: 260px; font-weight: 900; letter-spacing: -6px; text-transform: uppercase; }
      .brand-line { font-size: 56px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- ═══ FRAME 1 ═══ -->
  <rect x="0" y="0" width="1080" height="1920" fill="#080808"/>
  <!-- label -->
  <text x="40" y="72" class="label">Frame 01 · 0s</text>
  <!-- corner -->
  <text x="980" y="72" text-anchor="end" class="corner">@genesneakers</text>
  <!-- main text -->
  <text x="90" y="820" class="hero" fill="#F3EFE6">SABE</text>
  <text x="90" y="1030" class="hero" fill="#F3EFE6">AQUELE</text>
  <text x="90" y="1240" class="hero" fill="#F3EFE6">NIKE QUE</text>
