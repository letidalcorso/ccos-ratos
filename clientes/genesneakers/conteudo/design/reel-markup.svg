  <text x="4360" y="72" class="label">Frame 05 · 12s</text>
  <!-- main statement -->
  <text x="4410" y="640" class="brand-line" fill="#3C3C3C">A GENE NÃO COBRA</text>
  <text x="4410" y="820" class="hero" fill="#F3EFE6">MARKUP</text>
