  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;display=swap');
      .display { font-family: 'Big Shoulders Display', 'Arial Black', sans-serif; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1400" height="500" fill="#F2EFE9"/>

  <text x="700" y="310" class="display" font-size="340" fill="#0D0D0D" text-anchor="middle">GENE</text>
  <text x="700" y="420" class="display" font-size="100" fill="#8CA62D" text-anchor="middle" letter-spacing="0.06em">SNEAKERS</text>
