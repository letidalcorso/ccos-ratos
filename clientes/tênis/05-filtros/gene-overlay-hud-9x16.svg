<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!--
    Gene Sneakers · Overlay HUD · Story / Reel 9:16
    Mesma lógica do overlay 4:5 adaptada para vertical — crosshairs cantos + HUD top/bottom.
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .mono { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; }
      .mono-r { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.05em; }
    </style>
  </defs>

  <!-- ================ CROSSHAIRS CANTOS ================ -->
  <g stroke="#C4FF3C" stroke-width="3" fill="none">
    <!-- TL -->
    <line x1="50" y1="50" x2="50" y2="110"/>
    <line x1="50" y1="50" x2="110" y2="50"/>
    <!-- TR -->
    <line x1="1030" y1="50" x2="1030" y2="110"/>
    <line x1="1030" y1="50" x2="970" y2="50"/>
    <!-- BL -->
    <line x1="50" y1="1870" x2="50" y2="1810"/>
    <line x1="50" y1="1870" x2="110" y2="1870"/>
    <!-- BR -->
    <line x1="1030" y1="1870" x2="1030" y2="1810"/>
    <line x1="1030" y1="1870" x2="970" y2="1870"/>
  </g>

  <!-- ================ TOP BAR ================ -->
  <g>
    <rect x="130" y="60" width="280" height="40" fill="#0D0D0D"/>
    <text x="144" y="87" class="mono" font-size="18" fill="#C4FF3C">SKU · GN-AJ1-26</text>
  </g>

  <text x="960" y="88" class="mono-r" font-size="16" fill="#F2EFE9" text-anchor="end" letter-spacing="0.08em">
    <tspan fill="#C4FF3C">◆</tspan> 23°S · 46°W
  </text>

  <!-- ================ CENTER CROSSHAIR ================ -->
  <g stroke="#C4FF3C" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="525" y1="960" x2="555" y2="960"/>
    <line x1="540" y1="945" x2="540" y2="975"/>
    <circle cx="540" cy="960" r="18"/>
  </g>
  <text x="572" y="965" class="mono" font-size="12" fill="#C4FF3C" opacity="0.9">TARGET</text>

  <!-- ================ LATERAL TICKS ================ -->
  <g stroke="#C4FF3C" stroke-width="1.5" opacity="0.55">
    <line x1="50" y1="500" x2="75" y2="500"/>
    <line x1="50" y1="700" x2="68" y2="700"/>
    <line x1="50" y1="900" x2="75" y2="900"/>
    <line x1="50" y1="1100" x2="68" y2="1100"/>
    <line x1="50" y1="1300" x2="75" y2="1300"/>
    <line x1="50" y1="1500" x2="68" y2="1500"/>
  </g>
  <text x="85" y="505" class="mono-r" font-size="11" fill="#C4FF3C" opacity="0.7">050</text>
  <text x="85" y="905" class="mono-r" font-size="11" fill="#C4FF3C" opacity="0.7">100</text>
  <text x="85" y="1305" class="mono-r" font-size="11" fill="#C4FF3C" opacity="0.7">150</text>

  <!-- Right side vertical text -->
  <g transform="translate(1008, 960) rotate(90)">
    <text x="0" y="0" class="mono-r" font-size="14" fill="#F2EFE9" opacity="0.7" text-anchor="middle" letter-spacing="0.3em">GENE · LIVE</text>
  </g>

  <!-- ================ DIVIDER ACID (canônico) ================ -->
  <rect x="50" y="1720" width="980" height="3" fill="#C4FF3C"/>

  <!-- ================ BOTTOM BAR ================ -->
  <text x="70" y="1778" class="mono" font-size="18" fill="#F2EFE9">21.04 / DROP-26</text>

  <circle cx="500" cy="1770" r="6" fill="#C4FF3C"/>
  <text x="516" y="1778" class="mono" font-size="16" fill="#F2EFE9">REC</text>
  <text x="580" y="1778" class="mono" font-size="16" fill="#F2EFE9" opacity="0.5">· LIVE CAPTURE</text>

  <text x="1010" y="1778" class="mono-r" font-size="16" fill="#F2EFE9" text-anchor="end">FRAME 001 / 036</text>
</svg>
