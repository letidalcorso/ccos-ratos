<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet"/>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      width:1080px;height:1920px;overflow:hidden;
      background:#0D0D0D;color:#F2EFE9;
      font-family:'IBM Plex Mono',monospace;
      -webkit-font-smoothing:antialiased;
    }
    .story{
      width:1080px;height:1920px;
      padding:90px 88px;
      display:flex;flex-direction:column;
      justify-content:space-between;
    }
    .label{
      font-size:22px;letter-spacing:.22em;text-transform:uppercase;
      color:#CBF23D;font-weight:500;
    }
    .big{
      font-family:'Big Shoulders Display',sans-serif;
      font-weight:900;text-transform:uppercase;
      line-height:.92;color:#F2EFE9;
    }
    .sub{font-size:28px;color:#A6A4A1;line-height:1.7;letter-spacing:.02em;}
    .acid{color:#CBF23D;}
    .bottom{font-size:20px;letter-spacing:.14em;color:#A6A4A1;}
    .divider{height:2px;background:#CBF23D;width:100%;margin:0;}
  .date-big{font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:340px;line-height:.85;color:#F2EFE9;letter-spacing:-.02em;}
  .date-month{font-size:44px;letter-spacing:.3em;color:#CBF23D;font-weight:500;margin-bottom:56px;}
  .drop-title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:108px;line-height:.92;text-transform:uppercase;margin-bottom:48px;}
</style>
</head><body><div class="story">
  <div class="label">DROPS —</div>
  <div>
    <div class="date-big">21</div>
    <div class="date-month">.ABR</div>
    <div class="divider"></div>
    <div style="height:40px;"></div>
    <div class="drop-title">PRIMEIRO<br/>DROP.</div>
    <div class="sub">Qual modelo você quer?</div>
  </div>
  <div class="bottom">gene.sneakers &nbsp;·&nbsp; <span class="acid">↓ nos fala qual.</span></div>
</div></body></html>
