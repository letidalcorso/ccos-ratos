<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet"/>
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      width:1080px;height:1920px;overflow:hidden;
      background:#0D0D0D;color:#F2EFE9;
      font-family:'IBM Plex Mono',monospace;
      -webkit-font-smoothing:antialiased;
    }
    .story{
      width:1080px;height:1920px;
      padding:90px 88px;
      display:flex;flex-direction:column;
      justify-content:space-between;
    }
    .label{
      font-size:22px;letter-spacing:.22em;text-transform:uppercase;
      color:#CBF23D;font-weight:500;
    }
    .big{
      font-family:'Big Shoulders Display',sans-serif;
      font-weight:900;text-transform:uppercase;
      line-height:.92;color:#F2EFE9;
    }
    .sub{font-size:28px;color:#A6A4A1;line-height:1.7;letter-spacing:.02em;}
    .acid{color:#CBF23D;}
    .bottom{font-size:20px;letter-spacing:.14em;color:#A6A4A1;}
    .divider{height:2px;background:#CBF23D;width:100%;margin:0;}
  .quote{font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:168px;line-height:.88;text-transform:uppercase;}
  .author{font-size:24px;letter-spacing:.18em;color:#A6A4A1;margin-top:56px;}
</style>
</head><body><div class="story">
  <div class="label">CULTURA —</div>
  <div>
    <div class="quote">
      O TÊNIS<br/>
      <span class="acid">CERTO</span><br/>
      MUDA<br/>
      O DIA.
    </div>
    <div class="author">— Gene Sneakers</div>
  </div>
  <div class="bottom"><span style="letter-spacing:.2em;">.ESTILO NOS PÉS.</span></div>
</div></body></html>
