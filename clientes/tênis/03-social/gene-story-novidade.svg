<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .display  { font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:900; letter-spacing:-0.02em; text-transform:uppercase; }
      .display-b{ font-family:'Big Shoulders Display','Arial Black',sans-serif; font-weight:700; letter-spacing:0; }
      .mono     { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }
      .mono-r   { font-family:'IBM Plex Mono','Menlo',monospace; font-weight:400; letter-spacing:0.12em; }
    </style>
  </defs>

  <!-- CARBON field -->
  <rect width="1080" height="1920" fill="#0D0D0D"/>

  <!-- Top kicker em Acid (simples, sem // tag) -->
  <text x="540" y="260" class="mono" font-size="24" fill="#C4FF3C" text-anchor="middle">· chegamos</text>

  <!-- Ondas concêntricas em Acid (signature GENE, minimal) -->
  <g stroke="#C4FF3C" fill="none" stroke-linecap="round">
    <path d="M 360 560 Q 540 420, 720 560" stroke-width="9"/>
    <path d="M 300 560 Q 540 380, 780 560" stroke-width="7" opacity="0.72"/>
    <path d="M 240 560 Q 540 340, 840 560" stroke-width="5" opacity="0.48"/>
    <path d="M 180 560 Q 540 300, 900 560" stroke-width="3" opacity="0.28"/>
  </g>

  <!-- Hero headline -->
  <text x="540" y="900" class="display" font-size="130" fill="#F2EFE9" text-anchor="middle">GENE SNEAKERS</text>
  <text x="540" y="1060" class="display" font-size="170" fill="#C4FF3C" text-anchor="middle">CHEGOU.</text>

  <!-- Acid dot separator -->
  <circle cx="540" cy="1150" r="8" fill="#C4FF3C"/>

  <!-- Três linhas técnicas (afirmação, sem oposição ao varejo) -->
  <text x="540" y="1320" class="display-b" font-size="70" fill="#F2EFE9" text-anchor="middle">tênis de marca.</text>
  <text x="540" y="1410" class="display-b" font-size="70" fill="#F2EFE9" text-anchor="middle">sob encomenda.</text>
  <text x="540" y="1500" class="display-b" font-size="70" fill="#B97580" text-anchor="middle">modelos exclusivos.</text>

  <!-- Footer em Slate -->
  <line x1="80" y1="1780" x2="260" y2="1780" stroke="#A6A4A1" stroke-width="1.5"/>
  <text x="280" y="1788" class="mono-r" font-size="20" fill="#A6A4A1">GENE SNEAKERS · 2026</text>
</svg>
