<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Gene Sneakers · SELO DE CURADORIA · v2.0 PT
    Versão: ACID (statement · hero landing · packaging premium · selo-assinatura)
    Sistema: GENE ASSINA · CURADO · PRIMEIRA LEVA
    21.04.2026
  -->
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');
      .mono-r { font-family: 'IBM Plex Mono', monospace; font-weight: 400; }
      .mono-m { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .display-black { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; }
    ]]></style>
    <path id="circleTextPath" d="M 300,80 a 220,220 0 1,1 -0.01,0"/>
  </defs>

  <!-- Fundo Carbon circular preenchido -->
  <circle cx="300" cy="300" r="250" fill="#0D0D0D"/>

  <!-- Anéis Acid -->
  <circle cx="300" cy="300" r="250" fill="none" stroke="#C4FF3C" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="300" r="240" fill="none" stroke="#C4FF3C" stroke-width="2"/>

  <!-- Tick marks cardinais -->
  <g stroke="#C4FF3C" stroke-width="2">
    <line x1="300" y1="52"  x2="300" y2="68"/>
    <line x1="548" y1="300" x2="532" y2="300"/>
    <line x1="300" y1="548" x2="300" y2="532"/>
    <line x1="52"  y1="300" x2="68"  y2="300"/>
  </g>

  <!-- Tick secundários -->
  <g stroke="#C4FF3C" stroke-width="1" opacity="0.6">
    <line x1="475" y1="125" x2="465" y2="135"/>
    <line x1="475" y1="475" x2="465" y2="465"/>
    <line x1="125" y1="475" x2="135" y2="465"/>
    <line x1="125" y1="125" x2="135" y2="135"/>
  </g>

  <!-- Texto curvo PT · 360° -->
  <text class="mono-m" font-size="18" fill="#C4FF3C" letter-spacing="0.3em">
    <textPath href="#circleTextPath" startOffset="0">
      GENE ASSINA · CURADORIA AUTORAL · AUTÊNTICO · PRIMEIRA LEVA · 2026 · GENE ASSINA · CURADORIA AUTORAL · AUTÊNTICO · PRIMEIRA LEVA · 2026
    </textPath>
  </text>

  <!-- Anel interno dashed -->
  <circle cx="300" cy="300" r="190" fill="none" stroke="#C4FF3C" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>

  <!-- Diamante Bone pra destaque sobre Acid -->
  <g transform="translate(300, 205) rotate(45)">
    <rect x="-8" y="-8" width="16" height="16" fill="#F2EFE9"/>
  </g>

  <!-- GENE monograma central -->
  <text x="300" y="320" class="display-black" font-size="110" fill="#C4FF3C" text-anchor="middle" letter-spacing="-2">GENE</text>

  <!-- Linha divisora -->
  <line x1="230" y1="348" x2="370" y2="348" stroke="#C4FF3C" stroke-width="1" opacity="0.6"/>

  <!-- CURADO em Bone -->
  <text x="300" y="378" class="mono-m" font-size="18" fill="#F2EFE9" text-anchor="middle" letter-spacing="0.4em">CURADO</text>

  <!-- Footer -->
  <text x="300" y="410" class="mono-r" font-size="11" fill="#A6A4A1" text-anchor="middle" letter-spacing="0.3em">· N° 0001 · 21.04.26 ·</text>
</svg>
